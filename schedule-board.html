<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹디자인팀 일정보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2410-1@1.0/Paperlogy-5Medium.woff2') format('woff2');font-weight:500;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,sans-serif;background:#FAF9F6;color:#23262B;font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:#23262B;border:1px solid #DCD9D0;border-radius:8px;padding:7px 10px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #7C5CE0;outline-offset:1px}
a{color:#3a6fd8;text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:30px 22px 90px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:Paperlogy,'Pretendard Variable',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.3px}
.sub{font-size:13px;color:#8A877E;margin-top:3px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;background:#23262B;color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.line{background:#fff;color:#43464C;border:1px solid #DCD9D0}
.btn.ghost{background:none;color:#8A877E;padding:9px 8px;font-weight:500}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.lg-hint{font-size:12px;color:#A8A49A;margin-left:2px}
.mpill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px 5px 9px;border-radius:999px;color:#fff;font-weight:700;font-size:12.5px;cursor:pointer;border:none;line-height:1.3;transition:filter .15s,opacity .15s}
.mpill .mp-emoji{font-size:15px}
.mpill .mp-role{display:block;font-size:9px;font-weight:500;opacity:.85;letter-spacing:.3px}
.mpill.off{filter:grayscale(1);opacity:.45}
.mpill .mp-tag{font-size:9.5px;font-weight:600;border:1px solid rgba(255,255,255,.7);border-radius:999px;padding:0 6px;margin-left:2px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
.mcard{text-align:left;background:#F1EFE9;border-radius:14px;padding:14px 16px;transition:transform .08s;border:2px solid transparent}
.mcard:active{transform:scale(.98)}
.mcard .mc-label{font-size:12px;color:#7B786F;display:flex;justify-content:space-between;align-items:center}
.mcard .mc-num{font-size:25px;font-weight:700;margin-top:2px;font-family:Paperlogy,sans-serif}
.mcard.warn{background:#FBEFD9}
.mcard.warn .mc-label{color:#9A6206}
.mcard.warn .mc-num{color:#7A5004}
.mcard.sel{border-color:#23262B}
.mcard.warn.sel{border-color:#E8A33D}
.panel{margin-top:10px;background:#fff;border:1px solid #E7E4DB;border-radius:14px;overflow:hidden}
.panel .pn-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #F0EEE7;flex-wrap:wrap;font-size:13px}
.panel .pn-row:last-child{border-bottom:none}
.panel .pn-empty{padding:18px 16px;color:#A8A49A;font-size:13px}
.pn-title{font-weight:600;flex:1;min-width:160px}
.pn-sub{color:#8A877E;font-size:12px}
.dchip{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:#FBEFD9;color:#9A6206}
.dchip.late{background:#FBE2E2;color:#B23B3B}
.dchip.open{background:#FBE3D8;color:#A23A16}
.kchip{font-size:11px;padding:2px 8px;border-radius:999px;background:#F1EFE9;color:#7B786F}
section{margin-top:34px}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
h2{font-family:Paperlogy,sans-serif;font-weight:700;font-size:18px}
.sect .s-sub{font-size:12.5px;color:#A8A49A;font-weight:500;font-family:'Pretendard Variable',sans-serif;margin-left:8px}
.mini{font-size:12.5px;color:#7B786F;display:flex;align-items:center;gap:5px;cursor:pointer}
.mini input{accent-color:#23262B}
.tl-card{background:#fff;border:1px solid #E7E4DB;border-radius:14px;padding:15px 17px;margin-bottom:10px}
.tl-card.is-done{opacity:.62}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tl-head input[type=checkbox]{width:16px;height:16px;accent-color:#1D9E75;padding:0;cursor:pointer}
.tl-title{font-weight:700;font-size:14.5px}
.is-done .tl-title{text-decoration:line-through;color:#8A877E}
.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px}
.chip.biz{background:#EEF0F4;color:#4D5566}
.chip.reopen{background:#FBE2E2;color:#B23B3B}
.chip.solo{background:#F1EFE9;color:#7B786F;font-weight:500}
.tl-acts{margin-left:auto;display:flex;gap:2px}
.icbtn{font-size:11.5px;color:#A8A49A;padding:4px 7px;border-radius:7px}
.icbtn:hover{background:#F1EFE9;color:#43464C}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:11.5px;font-weight:600}
.seg{display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg a{color:inherit;text-decoration:underline dotted}
.ph-design{background:#BCEBD9;color:#074D39}
.ph-pub{background:#D9D2F8;color:#33277B}
.ph-plan{background:#CFE4FA;color:#16456F}
.ph-dev{background:#E2E0D8;color:#4A4A43}
.ph-qa{background:#F0EEE7;color:#84817A}
.ph-stub{background:#FDF6EC;color:#9A6206;border-left:2px solid #E8A33D}
.tl-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#8A877E}
.ho-line{color:#9A6206;font-weight:600}
.ho-line.late{color:#B23B3B}
.issue-list{margin-top:8px;border-top:1px dashed #E7E4DB;padding-top:8px}
.issue-row{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:#5B5950;padding:2px 0}
.issue-row input{accent-color:#1D9E75;margin-top:3px}
.issue-row.done span{text-decoration:line-through;color:#B5B2A8}
.cal-wrap{background:#fff;border:1px solid #E7E4DB;border-radius:14px;overflow:hidden}
.calnav{display:flex;align-items:center;gap:4px}
.calnav .nbtn{font-size:16px;padding:4px 10px;border-radius:8px;color:#7B786F}
.calnav .nbtn:hover{background:#F1EFE9}
#calTitle{font-weight:700;font-size:14.5px;min-width:96px;text-align:center;font-family:Paperlogy,sans-serif}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:#F7F5F0;font-size:11.5px;color:#8A877E;text-align:center;padding:7px 0;border-bottom:1px solid #EFEDE5}
.cal-dow .wkend{color:#C2BFB5}
.week{border-bottom:1px solid #F0EEE7}
.week:last-child{border-bottom:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;color:#7B786F}
.days span{padding:6px 8px 3px}
.days .out{color:#D4D1C8}
.days .wkend{color:#C2BFB5}
.days .wkend.out{color:#E4E2DA}
.days .today{font-weight:800;color:#fff;position:relative}
.days .today::before{content:'';position:absolute;left:5px;top:4px;width:20px;height:20px;border-radius:50%;background:#23262B;z-index:0}
.days .today::after{content:attr(data-d);position:absolute;left:5px;top:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;z-index:1}
.lanes{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:21px;gap:3px 3px;padding:1px 4px 9px;min-height:10px}
.bar-ev{border-radius:6px;color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;line-height:1.8}
.bar-ev.is-done{opacity:.4;text-decoration:line-through}
.cal-empty{padding:26px;text-align:center;color:#A8A49A;font-size:13px}
.empty{background:#fff;border:1px dashed #DCD9D0;border-radius:14px;padding:28px;text-align:center;color:#A8A49A;font-size:13px}
#overlay{position:fixed;inset:0;background:rgba(30,28,24,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
#overlay.show{display:flex}
.mbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:620px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.mbox h3{font-family:Paperlogy,sans-serif;font-size:17px;margin-bottom:4px}
.mbox .m-sub{font-size:12.5px;color:#8A877E;margin-bottom:14px}
.mbox textarea{width:100%;min-height:150px;resize:vertical;font-size:13px;line-height:1.6}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:11.5px;color:#8A877E;margin-bottom:3px;font-weight:600}
.fld input,.fld select{width:100%}
.phrow{display:grid;grid-template-columns:86px 1fr 1fr 96px 28px;gap:6px;margin-top:6px;align-items:center}
.phrow input{padding:6px 8px;font-size:12.5px}
.ph-head{font-size:11.5px;color:#8A877E;font-weight:600;margin-top:12px}
.m-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.note{font-size:12px;color:#9A6206;background:#FDF6EC;border-radius:8px;padding:8px 11px;margin-top:10px}
.dl-row{display:flex;gap:10px;font-size:13px;padding:5px 0;align-items:baseline}
.dl-row b{min-width:64px;font-size:12px;color:#8A877E;font-weight:600}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#23262B;color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>웹디자인팀 일정보드</h1>
      <p class="sub">메일·레드마인 텍스트를 붙여넣으면 일정이 자동으로 정리됩니다</p>
    </div>
    <div class="hbtns">
      <button class="btn" data-act="open-mail">메일 붙여넣기</button>
      <button class="btn" data-act="open-rm">레드마인 붙여넣기</button>
      <button class="btn line" data-act="add-manual">직접 추가</button>
      <button class="btn ghost" data-act="export">내보내기</button>
      <button class="btn ghost" data-act="import">가져오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </header>

  <div class="legend" id="legend"></div>

  <div class="cards" id="cards"></div>
  <div class="panel" id="panel" hidden></div>

  <section>
    <div class="sect">
      <h2>프로젝트 타임라인<span class="s-sub">단계가 이어지는 업무</span></h2>
      <label class="mini"><input type="checkbox" id="soloChk"> 퍼블 단독 건 표시</label>
    </div>
    <div id="timeline"></div>
  </section>

  <section>
    <div class="sect">
      <h2>담당자 워크로드<span class="s-sub">팀원 색 막대 · 범례를 누르면 켜고 끌 수 있어요</span></h2>
      <div class="calnav">
        <button class="nbtn" data-act="cal-prev" aria-label="이전 달">‹</button>
        <span id="calTitle"></span>
        <button class="nbtn" data-act="cal-next" aria-label="다음 달">›</button>
        <button class="btn ghost" data-act="cal-today">오늘</button>
      </div>
    </div>
    <div class="cal-wrap" id="cal"></div>
  </section>
</div>

<div id="overlay"><div class="mbox" id="mbox"></div></div>
<div id="toast" role="status"></div>

<script>
/* ── 기본 도우미 ───────────────────────────── */
var $=function(s){return document.querySelector(s);};
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function diff(a,b){return Math.round((fromISO(b)-fromISO(a))/86400000);}
function fmtMD(s){if(!s)return'';var d=fromISO(s);return (d.getMonth()+1)+'/'+d.getDate();}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(function(){t.classList.remove('show');},2200);}

var RM_BASE='http://10.30.100.24/issues/';
var BIZ=['T클래스','해법수학교실','닥터매쓰','스마트러닝','독서논술','FC 영어','FC 수학','마케팅','기타'];
var BIZKEY={'T클래스':['t클래스','티클래스'],'해법수학교실':['수학교실'],'닥터매쓰':['닥터매쓰'],'스마트러닝':['스마트러닝','공동구매'],'독서논술':['독서논술','해법독서','논술','세계사'],'FC 영어':['fc영어','fc 영어'],'FC 수학':['fc수학','fc 수학'],'마케팅':['마케팅','카드뉴스']};
function guessBiz(t){var s=String(t).toLowerCase();for(var b in BIZKEY){for(var i=0;i<BIZKEY[b].length;i++){if(s.indexOf(BIZKEY[b][i])>=0)return b;}}return '기타';}

/* ── 상태 / 저장 ───────────────────────────── */
var LS='wdsb_data_v1', FLAG='wdsb_init_v1';
var DEFAULT_MEMBERS=[
 {name:'김수영',nick:'soo',emoji:'🙈',role:'Designer',c1:'#FFB02E',c2:'#FF7A00',active:true,visible:true},
 {name:'김미리',nick:'havefunlife',emoji:'🧸',role:'Designer',c1:'#35E0A1',c2:'#00BFCB',active:true,visible:true},
 {name:'문효진',nick:'vava',emoji:'🐭',role:'Designer',c1:'#E07BF7',c2:'#B23BE0',active:true,visible:true},
 {name:'유서원',nick:'lina',emoji:'🦁',role:'Designer',c1:'#B5E03A',c2:'#2FBF55',active:false,visible:false},
 {name:'양동준',nick:'dongjun',emoji:'🐨',role:'Publisher',c1:'#56A4FF',c2:'#8B5CF6',active:true,visible:true}
];
var state=loadState();
function loadState(){
  try{var raw=localStorage.getItem(LS);if(raw){var s=JSON.parse(raw);if(s&&s.members)return s;}}catch(e){}
  if(localStorage.getItem(FLAG)){return blank();}
  localStorage.setItem(FLAG,'1');
  return seed();
}
function blank(){return {members:JSON.parse(JSON.stringify(DEFAULT_MEMBERS)),projects:[],tasks:[],ui:{solo:true}};}
function save(){localStorage.setItem(LS,JSON.stringify(state));}
function seed(){
  var s=blank();
  s.projects.push({id:uid('p'),title:'공동구매 프로세스 개선',biz:'스마트러닝',open:'2026-07-21',done:false,reopen:false,issues:[],
    phases:[
      {name:'디자인',start:'2026-05-18',end:'2026-05-20',owner:'김수영'},
      {name:'퍼블',start:'2026-05-26',end:'2026-05-29',owner:'양동준'},
      {name:'개발',start:'2026-06-04',end:'2026-07-09',owner:'오정희'},
      {name:'Dev',start:'2026-07-10',end:'2026-07-16',owner:'오정희'},
      {name:'Stg',start:'2026-07-20',end:'2026-07-20',owner:'오정희'}
    ]});
  s.tasks.push({id:uid('t'),rm:'20454',url:RM_BASE+'20454',title:'세계사 신규 학습생 이벤트 띠배너',tag:'퍼블',owner:'양동준',start:'2026-05-26',end:'2026-05-29',biz:'독서논술',status:'진행',prio:'보통',done:true,reopen:false,issues:[],chain:null});
  s.tasks.push({id:'t_d1',rm:'20431',url:RM_BASE+'20431',title:'FC수학 여름특강 상세페이지',tag:'디자인',owner:'김미리',start:'2026-06-08',end:'2026-06-12',biz:'FC 수학',status:'진행',prio:'보통',done:false,reopen:false,issues:[],chain:'c_fc1'});
  s.tasks.push({id:'t_p1',rm:'20458',url:RM_BASE+'20458',title:'FC수학 여름특강 상세페이지',tag:'퍼블',owner:'양동준',start:'2026-06-15',end:'2026-06-18',biz:'FC 수학',status:'대기',prio:'보통',done:false,reopen:false,issues:[],chain:'c_fc1'});
  s.tasks.push({id:uid('t'),rm:'20452',url:RM_BASE+'20452',title:'독서논술 LMS 메인 배너',tag:'디자인',owner:'문효진',start:'2026-06-10',end:'2026-06-18',biz:'독서논술',status:'진행',prio:'보통',done:false,reopen:false,issues:[],chain:null});
  s.tasks.push({id:uid('t'),rm:'20460',url:RM_BASE+'20460',title:'마케팅 카드뉴스 6월호',tag:'디자인',owner:'김수영',start:'2026-06-15',end:'2026-06-19',biz:'마케팅',status:'대기',prio:'보통',done:false,reopen:false,issues:[],chain:null});
  s.tasks.push({id:uid('t'),rm:'20449',url:RM_BASE+'20449',title:'T클래스 학습리포트 개편',tag:'퍼블',owner:'양동준',start:'2026-06-09',end:'2026-06-16',biz:'T클래스',status:'진행',prio:'높음',done:false,reopen:true,issues:[{id:uid('i'),text:'메인 배너 카피 변경 요청',date:'2026-06-10',done:false}],chain:null});
  return s;
}
function member(name){if(!name)return null;var n=String(name).trim();for(var i=0;i<state.members.length;i++){var m=state.members[i];if(m.name===n||m.nick===n||n.indexOf(m.name)>=0)return m;}return null;}
function ownerDisp(name){var m=member(name);return m?m.nick:esc(name);}

/* ── 파서 ─────────────────────────────────── */
function normName(s){
  var n=String(s).replace(/(팀장님|팀장|책임님|선임님|님|씨)\s*$/,'').trim();
  var p=n.split(/\s+/);
  if(p.length===2&&/^[가-힣]+$/.test(p[0])&&/^[가-힣]{1,2}$/.test(p[1]))n=p[1]+p[0];
  return n;
}
function canonPhase(n){var u=n.trim().toLowerCase();if(u==='dev')return 'Dev';if(u==='stg')return 'Stg';if(u==='qa')return 'QA';return n.trim();}
function inferDate(m,d){
  var ty=today().getFullYear(),cands=[ty,ty+1,ty-1];
  for(var i=0;i<cands.length;i++){
    var di=cands[i]+'-'+pad(m)+'-'+pad(d);
    var df=diff(iso(today()),di);
    if(df>=-180&&df<=430)return di;
  }
  return ty+'-'+pad(m)+'-'+pad(d);
}
function parseMail(txt){
  var lines=txt.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var res={title:'',biz:'',open:'',phases:[],owners:{}};
  var phRe=/^[-*·•]?\s*(디자인|퍼블|기획|개발|Dev|Stg|QA)\s*[:：]\s*(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*[~\-–∼]\s*(?:(\d{1,2})\s*\/\s*)?(\d{1,2}))?/i;
  var openRe=/^[-*·•]?\s*(Open|오픈)\s*[:：]\s*(\d{1,2})\s*\/\s*(\d{1,2})/i;
  var ownRe=/^[-*·•]?\s*(디자인|퍼블|개발)\s*[:：]\s*([가-힣A-Za-z\s]+?)\s*$/;
  for(var i=0;i<lines.length;i++){
    var l=lines[i],m;
    m=l.match(openRe);
    if(m){res.open=inferDate(+m[2],+m[3]);continue;}
    m=l.match(phRe);
    if(m){
      var st=inferDate(+m[2],+m[3]),en=st;
      if(m[5]){var em=m[4]?+m[4]:+m[2];en=inferDate(em,+m[5]);if(diff(st,en)<0)en=st;}
      res.phases.push({name:canonPhase(m[1]),start:st,end:en,owner:''});continue;
    }
    if(!/\d\s*\//.test(l)){
      m=l.match(ownRe);
      if(m){res.owners[canonPhase(m[1])]=normName(m[2]);continue;}
    }
    if(!res.title&&!/^[-=ـ_]+$/.test(l)&&l.indexOf('일정 안내')<0){
      res.title=l.replace(/\s*건\s*일정.*$/,'').replace(/\s*일정\s*산정.*$/,'').replace(/\s*공유\s*드립니다.*$/,'').trim();
    }
  }
  res.phases.forEach(function(p){
    if(res.owners[p.name])p.owner=res.owners[p.name];
    else if((p.name==='Dev'||p.name==='Stg'||p.name==='QA')&&res.owners['개발'])p.owner=res.owners['개발'];
  });
  res.biz=guessBiz(res.title+' '+txt);
  return res;
}
function parseRedmine(txt){
  var r={rm:'',url:'',title:'',tag:'기타',owner:'',start:'',end:'',status:'',prio:'',biz:''};
  var m=txt.match(/\[(.+)\]\((https?:\/\/[^\s)]+)\)/);
  if(m){
    r.url=m[2].split('#')[0];
    var t=m[1].match(/#(\d+)\s*[:：]?\s*(.*)$/);
    if(t){r.rm=t[1];r.title=t[2].trim();}else{r.title=m[1];}
  }else{
    var n=txt.match(/#(\d+)/);if(n)r.rm=n[1];
    var first=txt.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean)[0]||'';
    r.title=first.replace(/^\[?(신규|진행|수정)?\s*#\d+\s*[:：]?\s*/,'').replace(/\]?\s*(진행중|진행|신규|완료)?\s*$/,'').trim();
  }
  var tg=r.title.match(/\[(디자인|퍼블|기획|개발)\]/);
  if(tg)r.tag=tg[1];
  r.title=r.title.replace(/\[[^\]]*\]/g,'').trim();
  m=txt.match(/담당자\s*[:：]\s*(.+)/);if(m)r.owner=normName(m[1].split(/\r?\n/)[0]);
  m=txt.match(/시작시간\s*[:：]\s*(\d{4}-\d{2}-\d{2})/);if(m)r.start=m[1];
  m=txt.match(/완료기한\s*[:：]\s*(\d{4}-\d{2}-\d{2})/);if(m)r.end=m[1];
  m=txt.match(/상태\s*[:：]\s*(\S+)/);if(m)r.status=m[1];
  m=txt.match(/우선순위\s*[:：]\s*(\S+)/);if(m)r.prio=m[1];
  if(!r.url&&r.rm)r.url=RM_BASE+r.rm;
  if(!r.end&&r.start)r.end=r.start;
  if(!r.start&&r.end)r.start=r.end;
  r.biz=guessBiz(r.title+' '+txt);
  return r;
}
function normT(t){return String(t).replace(/\[[^\]]*\]/g,'').replace(/[\s·\-–_]/g,'').toLowerCase();}
function chainCandidates(title,excludeId){
  var n=normT(title);if(n.length<4)return [];
  return state.tasks.filter(function(t){
    if(t.id===excludeId)return false;
    var o=normT(t.title);
    return o.length>=4&&(o.indexOf(n)>=0||n.indexOf(o)>=0);
  });
}

/* ── 요약 계산 ─────────────────────────────── */
function tISO(){return iso(today());}
function weekRange(){var t=today();var mon=addD(t,-((t.getDay()+6)%7));return [iso(mon),iso(addD(mon,6))];}
function chainGroups(){
  var g={};
  state.tasks.forEach(function(t){if(t.chain){(g[t.chain]=g[t.chain]||[]).push(t);}});
  for(var k in g)g[k].sort(function(a,b){return a.start<b.start?-1:1;});
  return g;
}
function allHandoffs(){
  var hs=[];
  state.projects.forEach(function(p){
    if(p.done)return;
    for(var i=0;i<p.phases.length-1;i++){
      var a=p.phases[i],b=p.phases[i+1];
      hs.push({date:a.end,label:a.name+'→'+b.name+' 전달',owner:a.owner,title:p.title,url:null,ref:{type:'project',id:p.id}});
    }
  });
  var g=chainGroups();
  for(var k in g){
    var arr=g[k].filter(function(t){return !t.done;});
    var full=g[k];
    for(var i=0;i<full.length-1;i++){
      if(full[i].done)continue;
      hs.push({date:full[i].end,label:full[i].tag+'→'+full[i+1].tag+' 전달',owner:full[i].owner,title:full[i].title,url:full[i].url,rm:full[i].rm,ref:{type:'task',id:full[i].id}});
    }
    var last=full[full.length-1];
    if(last&&!last.done&&last.tag==='퍼블')hs.push({date:last.end,label:'퍼블→개발 전달',owner:last.owner,title:last.title,url:last.url,rm:last.rm,ref:{type:'task',id:last.id}});
  }
  state.tasks.forEach(function(t){
    if(t.chain||t.done||t.tag!=='퍼블')return;
    hs.push({date:t.end,label:'퍼블→개발 전달',owner:t.owner,title:t.title,url:t.url,rm:t.rm,ref:{type:'task',id:t.id}});
  });
  hs.sort(function(a,b){return a.date<b.date?-1:1;});
  return hs;
}
function listOpens(){
  var wr=weekRange();
  return state.projects.filter(function(p){return !p.done&&p.open&&p.open>=wr[0]&&p.open<=wr[1];});
}
function listHandoffsImminent(){
  var t=tISO();
  return allHandoffs().filter(function(h){var d=diff(t,h.date);return d>=-7&&d<=2;});
}
function listOngoing(){
  var t=tISO(),rows=[];
  state.projects.forEach(function(p){
    if(p.done||!p.phases.length)return;
    var s=p.phases[0].start,e=p.open||p.phases[p.phases.length-1].end;
    if(s<=t&&t<=e)rows.push({kind:'타임라인',title:p.title,owner:'',sub:fmtMD(s)+'~'+(p.open?'Open '+fmtMD(p.open):fmtMD(e)),url:null,ref:{type:'project',id:p.id}});
  });
  state.tasks.forEach(function(tk){
    if(tk.done)return;
    var inSpan=tk.start&&tk.end&&tk.start<=t&&t<=tk.end;
    var going=(tk.status||'').indexOf('진행')>=0;
    if(inSpan||going)rows.push({kind:'단건',title:tk.title,owner:tk.owner,sub:(tk.tag!=='기타'?tk.tag+' · ':'')+fmtMD(tk.start)+'~'+fmtMD(tk.end),url:tk.url,rm:tk.rm,ref:{type:'task',id:tk.id}});
  });
  return rows;
}
function listIssues(){
  var rows=[];
  function pull(item,type){
    (item.issues||[]).forEach(function(is){
      if(!is.done)rows.push({issue:is,host:item,type:type});
    });
  }
  state.projects.forEach(function(p){pull(p,'project');});
  state.tasks.forEach(function(t){pull(t,'task');});
  return rows;
}

/* ── 렌더: 타임라인 ─────────────────────────── */
function phCls(name){
  if(name==='디자인')return 'ph-design';
  if(name==='퍼블')return 'ph-pub';
  if(name==='기획')return 'ph-plan';
  if(name==='개발')return 'ph-dev';
  return 'ph-qa';
}
function segHtml(cls,flex,label,titleAttr){
  return '<div class="seg '+cls+'" style="flex:'+flex+'" title="'+esc(titleAttr||label)+'">'+label+'</div>';
}
function nextHandoffLine(hs){
  var t=tISO(),up=null,late=null;
  hs.forEach(function(h){
    var d=diff(t,h.date);
    if(d<0&&d>=-7&&!late)late=h;
    if(d>=0&&(!up||h.date<up.date))up=h;
  });
  var h=late||up;
  if(!h)return '';
  var d=diff(t,h.date);
  var cls=d<0?'ho-line late':'ho-line';
  var txt=d<0?esc(h.label)+' '+fmtMD(h.date)+' · '+(-d)+'일 지연':esc(h.label)+' '+fmtMD(h.date)+' · D-'+d;
  return '<span class="'+cls+'">⇄ '+txt+'</span>';
}
function issuesHtml(item,type){
  var arr=item.issues||[];
  if(!arr.length)return '';
  return '<div class="issue-list">'+arr.map(function(is){
    return '<label class="issue-row'+(is.done?' done':'')+'"><input type="checkbox" '+(is.done?'checked':'')+' data-act="issue-done" data-type="'+type+'" data-host="'+item.id+'" data-iid="'+is.id+'"><span>'+esc(is.text)+' <em style="color:#B5B2A8;font-style:normal;font-size:11px">'+fmtMD(is.date)+'</em></span></label>';
  }).join('')+'</div>';

function cardActs(type,id,done){
  var reopenBtn=done?'<button class="icbtn" data-act="reopen" data-type="'+type+'" data-id="'+id+'">수정요청 재오픈</button>':'';
  return '<span class="tl-acts">'+reopenBtn+'<button class="icbtn" data-act="issue-add" data-type="'+type+'" data-id="'+id+'">+ 이슈</button><button class="icbtn" data-act="edit" data-type="'+type+'" data-id="'+id+'">수정</button><button class="icbtn" data-act="del" data-type="'+type+'" data-id="'+id+'">삭제</button></span>';

function projCard(p){
  var total=0;
  p.phases.forEach(function(ph){total+=Math.max(1,diff(ph.start,ph.end)+1);});
  var segs=p.phases.map(function(ph){
    var dur=Math.max(1,diff(ph.start,ph.end)+1);
    var flex=Math.max(.8,dur/Math.max(total,1)*10);
    var lab=ph.name+' '+fmtMD(ph.start)+(ph.end!==ph.start?'~'+fmtMD(ph.end):'')+(ph.owner?' · '+ownerDisp(ph.owner):'');
    return segHtml(phCls(ph.name),flex.toFixed(2),lab,p.title+' · '+lab);
  }).join('');
  var openChip='';
  if(p.open){
    var d=diff(tISO(),p.open);
    openChip='<span class="dchip open">Open '+fmtMD(p.open)+(d>=0?' · D-'+d:' · 오픈됨')+'</span>';
  }
  var hs=allHandoffs().filter(function(h){return h.ref.type==='project'&&h.ref.id===p.id;});
  return '<div class="tl-card'+(p.done?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(p.done?'checked':'')+' data-act="done" data-type="project" data-id="'+p.id+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(p.title)+'</span>'

function taskSeg(t,flex){

function renderTimeline(){
  var g=chainGroups(),html='';

  state.projects.forEach(function(p){
    var s=p.phases.length?p.phases[0].start:'9999';

}

/* ── 렌더: 달력 ─────────────────────────────── */
var calY=today().getFullYear(),calM=today().getMonth();
function collectBars(){
  var bars=[];
  state.tasks.forEach(function(t){
    if(!t.start||!t.end)return;
    bars.push({s:t.start,e:t.end,owner:t.owner,label:(t.rm?'#'+t.rm+' ':'')+t.title,done:t.done,type:'task',id:t.id});
  });
  state.projects.forEach(function(p){
    p.phases.forEach(function(ph){
      if(!member(ph.owner))return;
      bars.push({s:ph.start,e:ph.end,owner:ph.owner,label:p.title+' · '+ph.name,done:p.done,type:'project',id:p.id});
    });
  });
  return bars.filter(function(b){var m=member(b.owner);return m&&m.visible;});
}
function renderCal(){
  $('#calTitle').textContent=calY+'년 '+(calM+1)+'월';
  var first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  var cur=addD(first,-((first.getDay()+6)%7));
  var bars=collectBars(),t=tISO(),html='';
  html+='<div class="cal-dow">'+['월','화','수','목','금','토','일'].map(function(d,i){return '<span class="'+(i>4?'wkend':'')+'">'+d+'</span>';}).join('')+'</div>';
  var any=false;
  while(cur<=last){
    var wkS=iso(cur),wkE=iso(addD(cur,6));
    var dn='<div class="days">';
    for(var i=0;i<7;i++){
      var d=addD(cur,i),inM=d.getMonth()===calM,isT=iso(d)===t;
      var cls=(inM?'':'out ')+(i>4?'wkend ':'')+(isT?'today':'');
      dn+='<span class="'+cls.trim()+'"'+(isT?' data-d="'+d.getDate()+'"':'')+'>'+(isT?'':d.getDate())+'</span>';
    }
    dn+='</div>';
    var wb=bars.filter(function(b){return b.s<=wkE&&b.e>=wkS;}).sort(function(a,b){return a.s<b.s?-1:1;});
    var lanes=[],bh='';
    wb.forEach(function(b){
      var li=-1;
      for(var j=0;j<lanes.length;j++){if(lanes[j]<b.s){li=j;break;}}
      if(li<0){li=lanes.length;lanes.push(b.e);}else{lanes[li]=b.e;}
      var si=Math.max(0,diff(wkS,b.s)),ei=Math.min(6,diff(wkS,b.e));
      var m=member(b.owner);
      var st='grid-column:'+(si+1)+'/'+(ei+2)+';grid-row:'+(li+1)+';background:linear-gradient(120deg,'+m.c1+','+m.c2+')';
      bh+='<button class="bar-ev'+(b.done?' is-done':'')+'" style="'+st+'" data-act="bar" data-type="'+b.type+'" data-id="'+b.id+'" title="'+esc(b.owner+' · '+b.label+' ('+fmtMD(b.s)+'~'+fmtMD(b.e)+')')+'">'+esc(b.label)+'</button>';
      any=true;
    });
    html+='<div class="week">'+dn+'<div class="lanes">'+bh+'</div></div>';
    cur=addD(cur,7);
  }
  if(!any)html+='<div class="cal-empty">이 달에 표시할 업무가 없습니다. 레드마인 텍스트를 붙여넣어 보세요.</div>';
  $('#cal').innerHTML=html;
}
function renderAll(){renderLegend();renderCards();renderTimeline();renderCal();$('#soloChk').checked=!!state.ui.solo;}

/* ── 모달 ─────────────────────────────────── */
function openModal(html){$('#mbox').innerHTML=html;$('#overlay').classList.add('show');}
function closeModal(){$('#overlay').classList.remove('show');$('#mbox').innerHTML='';}
function memList(){return '<datalist id="memList">'+state.members.map(function(m){return '<option value="'+esc(m.name)+'">';}).join('')+'</datalist>';}
function bizSelHtml(id,val){return '<select id="'+id+'">'+BIZ.map(function(b){return '<option '+(b===val?'selected':'')+'>'+b+'</option>';}).join('')+'</select>';}
function phaseRowHtml(ph){
  ph=ph||{name:'',start:'',end:'',owner:''};
  return '<div class="phrow">'
    +'<input class="ph-name" value="'+esc(ph.name)+'" placeholder="단계">'

function openMailModal(){
  openModal('<h3>메일 붙여넣기</h3><p class="m-sub">일정 안내 메일 본문을 그대로 붙여넣으면 단계별 일정을 읽어옵니다.</p>'
    +'<textarea id="mailTxt" placeholder="공동구매 프로세스 개선 건 일정 산정되어 공유 드립니다.&#10;- 디자인 : 5/18~5/20&#10;- 퍼블 : 5/26~5/29&#10;- 개발: 6/4~7/9&#10;- Open : 7/21(화)&#10;디자인: 김수영 팀장님 ..."></textarea>'

}
function mailPreview(d,pid){
  var rows=(d.phases&&d.phases.length?d.phases:[{name:'디자인',start:'',end:'',owner:''}]).map(phaseRowHtml).join('');
  openModal('<h3>'+(pid?'타임라인 수정':'일정 확인')+'</h3><p class="m-sub">읽어온 내용을 확인하고 필요하면 고친 뒤 저장하세요.</p>'+memList()
    +'<div class="fgrid">'
    +'<div class="fld full"><label>업무명</label><input id="mTitle" value="'+esc(d.title)+'"></div>'
    +'<div class="fld"><label>사업단</label>'+bizSelHtml('mBiz',d.biz)+'</div>'
    +'<div class="fld"><label>오픈일</label><input type="date" id="mOpen" value="'+esc(d.open||'')+'"></div>'
    +'</div>'
    +'<div class="ph-head">단계 일정</div><div id="phRows">'+rows+'</div>'
    +'<button class="icbtn" data-act="ph-add" style="margin-top:6px">+ 단계 추가</button>'
    +'<div class="m-acts"><button class="btn line" data-act="modal-close">닫기</button><button class="btn" data-act="save-mail" data-pid="'+(pid||'')+'">저장</button></div>');
}
function readPhaseRows(){
  var out=[];
  document.querySelectorAll('#phRows .phrow').forEach(function(r){
    var name=r.querySelector('.ph-name').value.trim();
    var s=r.querySelector('.ph-s').value,e=r.querySelector('.ph-e').value;
    var o=r.querySelector('.ph-o').value.trim();
    if(name&&s){out.push({name:name,start:s,end:e||s,owner:o});}
  });
  out.sort(function(a,b){return a.start<b.start?-1:1;});
  return out;
}
function openRmModal(){
  openModal('<h3>레드마인 붙여넣기</h3><p class="m-sub">레드마인 일감 텍스트를 그대로 붙여넣으면 번호·담당자·기간을 읽어옵니다.</p>'
    +'<textarea id="rmTxt" placeholder="[신규 #20454: [퍼블] 세계사 신규 학습생 이벤트 띠배너](http://10.30.100.24/issues/20454) 진행중&#10;* 담당자: 동준 양&#10;* 시작시간: 2026-05-26&#10;* 완료기한: 2026-05-29"></textarea>'
    +'<div class="m-acts"><button class="btn line" data-act="modal-close">닫기</button><button class="btn" data-act="parse-rm">분석하기</button></div>');
  $('#rmTxt').focus();
}
function chainSelHtml(cands,excludeId,currentChain){
  var opts='<option value="">연결 안 함</option>',seen={};
  cands.forEach(function(t){
    seen[t.id]=1;
    opts+='<option value="'+t.id+'" '+(currentChain&&t.chain===currentChain?'selected':'')+'>추천 · #'+esc(t.rm||'?')+' ['+esc(t.tag)+'] '+esc(t.title)+'</option>';
  });
  state.tasks.filter(function(t){return t.id!==excludeId&&!seen[t.id];}).slice(0,25).forEach(function(t){
    opts+='<option value="'+t.id+'" '+(currentChain&&t.chain===currentChain?'selected':'')+'>#'+esc(t.rm||'?')+' ['+esc(t.tag)+'] '+esc(t.title)+'</option>';
  });
  return '<select id="rmChain">'+opts+'</select>';
}
function rmPreview(d,tid){
  var cands=chainCandidates(d.title,tid||null);
  var cur=null;
  if(tid){var ex=findTask(tid);cur=ex?ex.chain:null;}
  var note=cands.length&&!tid?'<div class="note">제목이 비슷한 업무를 찾았어요. 같은 프로젝트라면 아래에서 연결해 주세요 — 연결하면 한 타임라인으로 합쳐집니다.</div>':'';
  var tags=['디자인','퍼블','기획','개발','기타'].map(function(t){return '<option '+(t===d.tag?'selected':'')+'>'+t+'</option>';}).join('');
  openModal('<h3>'+(tid?'업무 수정':'업무 확인')+'</h3><p class="m-sub">읽어온 내용을 확인하고 필요하면 고친 뒤 저장하세요.</p>'+memList()+note
    +'<div class="fgrid">'
    +'<div class="fld full"><label>업무명</label><input id="rmTitle" value="'+esc(d.title)+'"></div>'
    +'<div class="fld"><label>레드마인 번호</label><input id="rmNum" value="'+esc(d.rm)+'" placeholder="20454"></div>'
    +'<div class="fld"><label>단계 태그</label><select id="rmTag">'+tags+'</select></div>'
    +'<div class="fld"><label>담당자</label><input id="rmOwner" list="memList" value="'+esc(d.owner)+'"></div>'
    +'<div class="fld"><label>사업단</label>'+bizSelHtml('rmBiz',d.biz)+'</div>'
    +'<div class="fld"><label>시작일</label><input type="date" id="rmStart" value="'+esc(d.start)+'"></div>'
    +'<div class="fld"><label>완료기한</label><input type="date" id="rmEnd" value="'+esc(d.end)+'"></div>'
    +'<div class="fld"><label>상태</label><input id="rmStatus" value="'+esc(d.status)+'" placeholder="진행"></div>'
    +'<div class="fld"><label>우선순위</label><input id="rmPrio" value="'+esc(d.prio)+'" placeholder="보통"></div>'
    +'<div class="fld full"><label>연결할 업무</label>'+chainSelHtml(cands,tid||null,cur)+'</div>'
    +'</div>'
    +'<div class="m-acts"><button class="btn line" data-act="modal-close">닫기</button><button class="btn" data-act="save-rm" data-tid="'+(tid||'')+'">저장</button></div>');
}
function openIssueModal(type,id){
  openModal('<h3>이슈 기록</h3><p class="m-sub">이 업무에 대한 이슈나 수정 요청을 메모해 두세요.</p>'
    +'<textarea id="issueTxt" style="min-height:80px" placeholder="예) 메인 배너 카피 변경 요청"></textarea>'
    +'<div class="m-acts"><button class="btn line" data-act="modal-close">닫기</button><button class="btn" data-act="save-issue" data-type="'+type+'" data-id="'+id+'">저장</button></div>');
  $('#issueTxt').focus();
}
function detailModal(type,id){
  if(type==='task'){
    var t=findTask(id);if(!t)return;
    var link=t.rm?'<a href="'+esc(t.url)+'" target="_blank" rel="noopener">#'+esc(t.rm)+' 레드마인에서 열기 ↗</a>':'<span class="pn-sub">레드마인 번호 없음</span>';
    openModal('<h3>'+esc(t.title)+'</h3><p class="m-sub">'+link+'</p>'
      +'<div class="dl-row"><b>담당</b>'+miniPill(t.owner)+'</div>'
      +'<div class="dl-row"><b>기간</b><span>'+fmtMD(t.start)+' ~ '+fmtMD(t.end)+'</span></div>'
      +'<div class="dl-row"><b>사업단</b><span>'+esc(t.biz)+'</span></div>'
      +'<div class="dl-row"><b>단계</b><span>'+esc(t.tag)+(t.tag==='퍼블'?' (완료기한 = 개발 전달일)':'')+'</span></div>'
      +'<div class="dl-row"><b>상태</b><span>'+esc(t.status||'-')+' · 우선순위 '+esc(t.prio||'-')+(t.done?' · 완료됨':'')+'</span></div>'
      +'<div class="m-acts"><button class="btn line" data-act="done" data-type="task" data-id="'+t.id+'">'+(t.done?'완료 해제':'완료 표시')+'</button>'
      +'<button class="btn line" data-act="issue-add" data-type="task" data-id="'+t.id+'">+ 이슈</button>'
      +'<button class="btn" data-act="edit" data-type="task" data-id="'+t.id+'">수정</button></div>');
  }else{
    var p=findProject(id);if(!p)return;
    var rows=p.phases.map(function(ph){
      return '<div class="dl-row"><b>'+esc(ph.name)+'</b><span>'+fmtMD(ph.start)+' ~ '+fmtMD(ph.end)+(ph.owner?' · '+esc(ph.owner):'')+'</span></div>';
    }).join('');
    openModal('<h3>'+esc(p.title)+'</h3><p class="m-sub">'+esc(p.biz)+(p.open?' · Open '+fmtMD(p.open):'')+'</p>'+rows
      +'<div class="m-acts"><button class="btn line" data-act="modal-close">닫기</button><button class="btn" data-act="edit" data-type="project" data-id="'+p.id+'">수정</button></div>');
  }
}

/* ── 데이터 조작 ───────────────────────────── */
function findTask(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];return null;}
function findProject(id){for(var i=0;i<state.projects.length;i++)if(state.projects[i].id===id)return state.projects[i];return null;}
function cleanupChains(){
  var g=chainGroups();
  for(var k in g)if(g[k].length<2)g[k].forEach(function(t){t.chain=null;});
}
function toggleDone(type,id){
  if(type==='project'){var p=findProject(id);if(p)p.done=!p.done;}
  else if(type==='chain'){
    var arr=(chainGroups()[id]||[]);
    var allDone=arr.every(function(t){return t.done;});
    arr.forEach(function(t){t.done=!allDone;});
  }
  else{var t=findTask(id);if(t)t.done=!t.done;}
  save();renderAll();closeModal();
}
function doReopen(type,id){
  if(type==='project'){var p=findProject(id);if(p){p.done=false;p.reopen=true;}}
  else{
    var t=findTask(id);
    if(t){
      var arr=t.chain?(chainGroups()[t.chain]||[t]):[t];
      arr.forEach(function(x){x.done=false;});
      t.reopen=true;
    }
  }
  save();renderAll();toast('수정 요청으로 다시 열었어요');
}
function doDelete(type,id){
  if(type==='project'){
    if(!confirm('이 타임라인을 삭제할까요?'))return;
    state.projects=state.projects.filter(function(p){return p.id!==id;});
  }else{
    if(!confirm('이 업무를 삭제할까요?'))return;
    state.tasks=state.tasks.filter(function(t){return t.id!==id;});
    cleanupChains();
  }
  save();renderAll();toast('삭제했어요');
}

/* ── 내보내기 / 가져오기 ─────────────────────── */
function exportJson(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='일정보드-백업-'+tISO()+'.json';
  a.click();
  toast('백업 파일을 내려받았어요');
}
function importJson(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=JSON.parse(rd.result);
      if(!s||!s.members||!s.tasks)throw new Error('bad');
      state=s;save();renderAll();toast('백업을 불러왔어요');
    }catch(e){toast('파일을 읽지 못했어요. 일정보드 백업 파일인지 확인해 주세요.');}
  };
  rd.readAsText(file);
}

/* ── 이벤트 ───────────────────────────────── */
document.addEventListener('click',function(e){
  if(e.target.id==='overlay'){closeModal();return;}
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.dataset.act,type=el.dataset.type,id=el.dataset.id;
  if(act==='open-mail')openMailModal();
  else if(act==='open-rm')openRmModal();
  else if(act==='add-manual')rmPreview({rm:'',url:'',title:'',tag:'디자인',owner:'',start:tISO(),end:tISO(),status:'진행',prio:'보통',biz:'기타'},null);
  else if(act==='export')exportJson();
  else if(act==='import')$('#importFile').click();
  else if(act==='modal-close')closeModal();
  else if(act==='sum-toggle'){selCard=(selCard===el.dataset.key?null:el.dataset.key);renderCards();}
  else if(act==='leg-toggle'){var m=member(el.dataset.name);if(m){m.visible=!m.visible;save();renderLegend();renderCal();}}
  else if(act==='cal-prev'){calM--;if(calM<0){calM=11;calY--;}renderCal();}
  else if(act==='cal-next'){calM++;if(calM>11){calM=0;calY++;}renderCal();}
  else if(act==='cal-today'){calY=today().getFullYear();calM=today().getMonth();renderCal();}
  else if(act==='bar')detailModal(type,id);
  else if(act==='done')toggleDone(type,id);
  else if(act==='reopen')doReopen(type,id);
  else if(act==='del')doDelete(type,id);
  else if(act==='issue-add'){closeModal();openIssueModal(type,id);}
  else if(act==='issue-done'){
    var host=(type==='project'?findProject(el.dataset.host):findTask(el.dataset.host));
    if(host){
      (host.issues||[]).forEach(function(is){if(is.id===el.dataset.iid)is.done=el.checked;});
      save();renderAll();
    }
  }
  else if(act==='save-issue'){
    var txt=$('#issueTxt').value.trim();
    if(!txt){toast('이슈 내용을 입력해 주세요');return;}
    var h=(type==='project'?findProject(id):findTask(id));
    if(h){h.issues=h.issues||[];h.issues.push({id:uid('i'),text:txt,date:tISO(),done:false});save();renderAll();}
    closeModal();toast('이슈를 기록했어요');
  }
  else if(act==='edit'){
    closeModal();
    if(type==='project'){var p=findProject(id);if(p)mailPreview({title:p.title,biz:p.biz,open:p.open,phases:p.phases},p.id);}
    else{var t=findTask(id);if(t)rmPreview(t,t.id);}
  }
  else if(act==='ph-add'){$('#phRows').insertAdjacentHTML('beforeend',phaseRowHtml(null));}
  else if(act==='ph-del'){el.closest('.phrow').remove();}
  else if(act==='parse-mail'){
    var txt=$('#mailTxt').value;
    if(!txt.trim()){toast('메일 본문을 붙여넣어 주세요');return;}
    var d=parseMail(txt);
    if(!d.phases.length&&!d.open){toast('일정 형식을 찾지 못했어요. 직접 입력으로 이어갈게요');}
    mailPreview(d,null);
  }
  else if(act==='save-mail'){
    var pid=el.dataset.pid;
    var phases=readPhaseRows();
    var title=$('#mTitle').value.trim();
    if(!title){toast('업무명을 입력해 주세요');return;}
    if(!phases.length){toast('단계 일정을 최소 1개 입력해 주세요');return;}
    if(pid){
      var p=findProject(pid);
      if(p){p.title=title;p.biz=$('#mBiz').value;p.open=$('#mOpen').value;p.phases=phases;}
      toast('타임라인을 수정했어요');
    }else{
      state.projects.push({id:uid('p'),title:title,biz:$('#mBiz').value,open:$('#mOpen').value,phases:phases,done:false,reopen:false,issues:[]});
      toast('타임라인에 등록했어요');
    }
    save();renderAll();closeModal();
  }
  else if(act==='parse-rm'){
    var txt2=$('#rmTxt').value;
    if(!txt2.trim()){toast('레드마인 텍스트를 붙여넣어 주세요');return;}
    rmPreview(parseRedmine(txt2),null);
  }
  else if(act==='save-rm'){
    var tid=el.dataset.tid;
    var title2=$('#rmTitle').value.trim();
    var start=$('#rmStart').value,end=$('#rmEnd').value||start;
    if(!title2){toast('업무명을 입력해 주세요');return;}
    if(!start){toast('시작일을 입력해 주세요');return;}
    var rm=$('#rmNum').value.trim();
    var sel=$('#rmChain').value,chain=null;
    if(sel){var tgt=findTask(sel);if(tgt){chain=tgt.chain||uid('c');tgt.chain=chain;}}
    var data={rm:rm,url:rm?RM_BASE+rm:'',title:title2,tag:$('#rmTag').value,owner:$('#rmOwner').value.trim(),start:start,end:end,biz:$('#rmBiz').value,status:$('#rmStatus').value.trim(),prio:$('#rmPrio').value.trim(),chain:chain};
    if(tid){
      var t2=findTask(tid);
      if(t2){for(var k in data)t2[k]=data[k];}
      toast('업무를 수정했어요');
    }else{
      data.id=uid('t');data.done=false;data.reopen=false;data.issues=[];
      state.tasks.push(data);
      toast(chain?'등록하고 타임라인으로 연결했어요':'달력에 등록했어요');
    }
    cleanupChains();save();renderAll();closeModal();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
$('#soloChk').addEventListener('change',function(){state.ui.solo=this.checked;save();renderTimeline();});
$('#importFile').addEventListener('change',function(){if(this.files[0])importJson(this.files[0]);this.value='';});
renderAll();
</script>
