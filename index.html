<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹디자인팀 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Pretendard','Noto Sans KR',sans-serif;
  --ftitle:'Paperlogy','Pretendard',sans-serif;
  --accent:#6366F1;--accent-soft:#EEF2FF;
  --teal:#0F9B8E;
  --amber:#F59E0B;--amber-soft:#FFFBEB;
  --red:#EF4444;--red-soft:#FEF2F2;
  --green:#10B981;--green-soft:#ECFDF5;
  --blue:#3B82F6;--blue-soft:#EFF6FF;
  --border:#E2E8F0;--border2:#CBD5E1;
  --bg:#F8FAFC;--bg2:#F1F5F9;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --white:#fff;
  --col-figma:#3a7d44;--col-adobe:#b84c1a;--col-industry:#7b3fa0;
  --col-design:#1a5fa0;--col-trend:#a06020;--col-frontend:#1a7a7a;--col-ai:#c2185b;
  --bg-figma:rgba(58,125,68,.09);--bg-adobe:rgba(184,76,26,.09);
  --bg-industry:rgba(123,63,160,.09);--bg-design:rgba(26,95,160,.09);
  --bg-trend:rgba(160,96,32,.09);--bg-frontend:rgba(26,122,122,.09);--bg-ai:rgba(194,24,91,.09);
}
html,body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);line-height:1.6}

/* NAV */
.gnav{background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.glogo{font-family:var(--ftitle);font-size:17px;font-weight:800;color:var(--accent);margin-right:2rem;white-space:nowrap;text-decoration:none}
.glogo span{color:var(--text)}
.gtabs{display:flex;height:100%}
.gtab{display:flex;align-items:center;gap:7px;padding:0 20px;font-size:15px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;font-family:var(--font);transition:color .15s}
.gtab:hover{color:var(--text)}
.gtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.gright{margin-left:auto;display:flex;align-items:center;gap:10px}
.gdate{font-size:14px;color:var(--text3)}

/* PAGE */
.page{display:none}
.page.on{display:block}

/* BTN */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--white);color:var(--text);font-size:14px;cursor:pointer;font-family:var(--font);font-weight:600;transition:background .12s}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#4F46E5}
.btn.sm{font-size:13px;padding:5px 11px}
.btn.del{color:var(--red);border-color:#FECACA}
.btn.del:hover{background:var(--red-soft)}
.btn.tl{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.tl:hover{background:#0C8278}
.btn.ghost{background:none;border-color:transparent;color:var(--text3);padding:7px 8px;font-weight:500}
.btn.ghost:hover{background:var(--bg2)}

/* 일정보드 */
#pg-db{padding:1.5rem;max-width:1100px;margin:0 auto}
.dbtop{display:flex;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px}
.sectitle{font-family:var(--ftitle);font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px}
.sectitle .ssub{font-family:var(--font);font-size:12.5px;color:var(--text3);font-weight:500;margin-left:8px}
.mini{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:400}
.mini input{accent-color:var(--text)}

/* 담당자 범례 */
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.legend.sm{gap:5px;margin:10px 0}
.legend.sm .mpill{padding:3px 10px 3px 7px;font-size:11px;gap:4px}
.legend.sm .mpill .mp-emoji{font-size:12px}
.legend.sm .mpill .mp-role{font-size:8px}
.legend.sm .mpill .mp-tag{font-size:8.5px;padding:0 5px}
.lg-hint{font-size:12px;color:var(--text3);margin-left:2px}
.legend.sm .lg-hint{font-size:10.5px}
.mpill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px 5px 9px;border-radius:20px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;border:none;line-height:1.3;transition:filter .15s,opacity .15s;font-family:var(--font)}
.mpill .mp-emoji{font-size:15px}
.mpill .mp-role{display:block;font-size:9px;font-weight:500;opacity:.85;letter-spacing:.3px}
.mpill.off{filter:grayscale(1);opacity:.45}
.mpill .mp-tag{font-size:9.5px;font-weight:600;border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:0 6px;margin-left:2px}

/* 요약 카드 */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1.25rem}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;font-family:var(--font);transition:border-color .15s}
.kpi.sel{border-color:var(--accent)}
.kpi-lbl{font-size:14px;color:var(--text3);margin-bottom:4px}
.kpi-val{font-family:var(--ftitle);font-size:28px;font-weight:800;color:var(--text)}
.kpi-val.ok{color:var(--green)}.kpi-val.warn{color:var(--amber)}.kpi-val.danger{color:var(--red)}

.panel{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem}
.panel .pn-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:14px}
.panel .pn-row:last-child{border-bottom:none}
.panel .pn-empty{padding:18px 16px;color:var(--text3);font-size:14px}
.pn-title{font-weight:600;flex:1;min-width:160px}
.pn-sub{color:var(--text3);font-size:13px}
.pn-strong{color:var(--text2);font-size:13px;font-weight:700}
.dchip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--amber-soft);color:var(--amber)}
.dchip.late{background:var(--red-soft);color:var(--red)}
.dchip.open{background:var(--accent-soft);color:var(--accent)}
.kchip{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--bg2);color:var(--text3)}

/* 타임라인 카드 */
.tl-card{background:var(--bg2);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tl-card.is-done{opacity:.6}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tl-head input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.tl-title{font-family:var(--ftitle);font-weight:700;font-size:14.5px}
.tl-card.is-done .tl-title{text-decoration:line-through;color:var(--text3)}
.chip{font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px}
.chip.biz{background:var(--accent-soft);color:var(--accent)}
.chip.reopen{background:var(--red-soft);color:var(--red)}
.chip.review{background:var(--blue-soft);color:var(--blue)}
.chip.solo{background:var(--bg2);border:1px solid var(--border2);color:var(--text3);font-weight:500}
.chip.rmwait{background:var(--amber-soft);color:var(--amber);font-weight:700}
.dchip.inspect{background:var(--blue-soft);color:var(--blue)}
.todaybox{margin-bottom:1rem}
.tdy-head{display:flex;align-items:center;gap:8px;padding:12px 16px;font-weight:700;font-size:14px;color:var(--text2);border-bottom:1px solid var(--border)}
.tdy-head.warn{color:var(--red);background:var(--red-soft)}
.tdy-head.ok{color:var(--text3);font-weight:600;border-bottom:none}
.todaybox.ok{background:var(--white)}
.tdy-glabel{font-size:11px;font-weight:700;color:var(--text3);padding:9px 16px 3px;background:var(--bg2)}
.dchip.review{background:var(--blue-soft);color:var(--blue)}
.tl-acts{margin-left:auto;display:flex;gap:2px}
.icbtn{font-size:12px;color:var(--text3);padding:4px 8px;border-radius:7px;border:none;background:none;font-family:var(--font);cursor:pointer}
.icbtn:hover{background:var(--white);color:var(--text)}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:600}
.seg{display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;position:relative}
.seg a{color:inherit;text-decoration:underline dotted}
.seg-edit{position:absolute;top:2px;right:2px;width:16px;height:16px;line-height:15px;text-align:center;border-radius:4px;border:none;padding:0;background:rgba(255,255,255,.6);color:inherit;font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s}
.seg:hover .seg-edit{opacity:1}
.ph-design{background:#9FE1CB;color:#085041}
.ph-pub{background:#B5D4F4;color:#0C447C}
.ph-plan{background:var(--accent-soft);color:var(--accent)}
.ph-dev{background:#D3D1C7;color:#444}
.ph-qa{background:#FAC775;color:#633806}
.ph-stub{background:var(--bg2);color:var(--text3);border-left:2px solid var(--amber)}
.tl-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--text3)}
.ho-line{color:var(--amber);font-weight:600}
.ho-line.late{color:var(--red)}
.issue-list{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.issue-row{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--text2);padding:2px 0}
.issue-row input{accent-color:var(--green);margin-top:3px}
.issue-row.done span{text-decoration:line-through;color:var(--text3)}

/* 담당자 워크로드 달력 */
.cal-wrap{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.calnav{display:flex;align-items:center;gap:4px}
.calnav .nbtn{font-size:16px;padding:4px 10px;border-radius:8px;color:var(--text3);border:none;background:none;font-family:var(--font);cursor:pointer}
.calnav .nbtn:hover{background:var(--bg2)}
.calnav span{font-family:var(--ftitle);font-weight:700;font-size:14.5px;min-width:96px;text-align:center;display:inline-block}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2);font-size:12px;color:var(--text3);text-align:center;padding:7px 0;border-bottom:1px solid var(--border)}
.cal-dow .wkend{opacity:.6}
.days .holiday{opacity:1;color:var(--red);font-weight:800}
.week{border-bottom:1px solid var(--border)}
.week:last-child{border-bottom:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--text3)}
.days span{padding:6px 8px 3px}
.days .out{opacity:.35}
.days .wkend{opacity:.6}
.days .today{font-weight:800;color:#fff;position:relative}
.days .today::before{content:'';position:absolute;left:5px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);z-index:0}
.days .today::after{content:attr(data-d);position:absolute;left:5px;top:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;z-index:1}
.lanes{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:21px;gap:3px 3px;padding:1px 4px 9px;min-height:10px}
.bar-ev{border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;line-height:1.8;border:none;font-family:var(--font)}
.bar-ev.is-done{opacity:.4;text-decoration:line-through}
/* ═══ 팀원별 업무 분포 ═══ */
.wl-toggle{display:inline-flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;margin-right:8px}
.wl-toggle button{border:none;background:var(--white);color:var(--text3);font-size:12.5px;font-weight:600;padding:5px 12px;cursor:pointer;font-family:var(--font)}
.wl-toggle button.on{background:var(--accent-soft);color:var(--accent)}
.dist-wrap{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow-x:auto}
.dist-head,.dist-row{display:flex;min-width:620px}
.dist-head{border-bottom:1px solid var(--border);background:var(--bg2)}
.dist-row{border-bottom:1px solid var(--border)}
.dist-row:last-child{border-bottom:none}
.dist-side{flex:0 0 150px;padding:9px 10px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;align-items:flex-start;justify-content:center}
.dist-cnt{font-size:11.5px;color:var(--text3)}
.dist-cnt b{color:var(--text2)}
.dist-days{flex:1;display:grid}
.dist-days span{font-size:10.5px;color:var(--text3);text-align:center;padding:5px 0;font-weight:600}
.dist-days span.wkend{color:var(--red);opacity:.55}
.dist-days span.holiday{color:var(--red);opacity:1;font-weight:800}
.dist-days span.today{background:var(--accent-soft);color:var(--accent);border-radius:6px}
.dist-grid{flex:1;position:relative;display:grid;grid-auto-rows:22px;gap:3px;padding:8px 0;align-content:start;min-height:42px}
.dist-cols{position:absolute;inset:0;display:grid;pointer-events:none}
.dist-cols span.wkend{background:var(--bg2)}
.dist-cols span.holiday{background:var(--red-soft)}
.dist-cols span.today{box-shadow:inset 2px 0 0 var(--accent)}
.dist-vacbg{position:absolute;inset:0;display:grid;pointer-events:none}
.dist-vacbg span{background:rgba(148,163,184,.32);border-radius:4px;pointer-events:auto;cursor:pointer}
.dist-grid .bar-ev{position:relative;z-index:1}
.bar-vac{background:rgba(148,163,184,.4)!important;color:var(--text2)!important;border:none}
.dist-empty{padding:16px;font-size:12.5px;color:var(--text3)}
/* 일정체크 미리보기 */
.chkhead,.chkrow{display:grid;grid-template-columns:minmax(120px,1fr) 84px 94px 58px 122px 122px 26px;gap:6px;align-items:center}
.chkhead{margin:10px 0 4px}
.chkhead span{font-size:11px;color:var(--text3);font-weight:600;padding-left:2px}
.rbhead,.rbrow{display:grid;grid-template-columns:70px minmax(140px,1fr) 84px 84px 122px 122px 26px;gap:6px;align-items:center}
.rbhead{margin:10px 0 4px}
.rbhead span{font-size:11px;color:var(--text3);font-weight:600;padding-left:2px}
.rbblock{margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--border2)}
.rb-chainline{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--text3)}
.rb-chainline select{flex:1}
.chkrow{margin-bottom:6px}
.cal-empty{padding:26px;text-align:center;color:var(--text3);font-size:14px}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;align-items:center;justify-content:center;padding:20px}
.moverlay.on{display:flex}
.mbox{background:var(--white);border-radius:16px;padding:1.75rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.mbox.wide{max-width:640px}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.mtitle{font-family:var(--ftitle);font-size:18px;font-weight:800}
.m-sub{font-size:13px;color:var(--text3);margin-bottom:14px}
.fl{margin-bottom:12px}
.fl label{font-size:14px;color:var(--text2);margin-bottom:5px;display:block;font-weight:600}
.fi{width:100%;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--white);color:var(--text);font-family:var(--font)}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--text3);margin-bottom:3px;font-weight:600}
.fld input,.fld select{width:100%}
.phblock{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.phblock:first-child{margin-top:0;padding-top:0;border-top:none}
.phrow{display:grid;grid-template-columns:80px 1fr 1fr 84px 88px 28px;gap:6px;align-items:center}
.phrow input{padding:6px 8px;font-size:12.5px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text);font-family:var(--font)}
.ph-c{margin-top:4px}
.revrow{display:grid;grid-template-columns:1.1fr 112px 84px 0.9fr 0.9fr 28px;gap:6px;margin-top:6px;align-items:center}
.revrow input{padding:6px 8px;font-size:12.5px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text);font-family:var(--font)}
.rvckhead,.rvckrow{display:grid;grid-template-columns:minmax(120px,1fr) 108px 88px 100px 130px 26px;gap:6px;align-items:center}
.rvckhead{margin:10px 0 4px}
.rvckhead span{font-size:11px;color:var(--text3);font-weight:600;padding-left:2px}
.rvckrow{margin-bottom:6px}
.rvckrow input{padding:6px 8px;font-size:12.5px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text);font-family:var(--font)}
.vachead,.vacrow{display:grid;grid-template-columns:minmax(90px,1fr) 112px 112px minmax(100px,1fr) 26px;gap:6px;align-items:center}
.vachead{margin:10px 0 4px}
.vachead span{font-size:11px;color:var(--text3);font-weight:600;padding-left:2px}
.vacrow{margin-bottom:6px}
.vacrow select,.vacrow input{padding:6px 8px;font-size:12.5px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text);font-family:var(--font)}
.ph-head{font-size:12px;color:var(--text3);font-weight:600;margin-top:12px}
.fsec{font-size:13px;font-weight:700;color:var(--text2);margin:16px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.factions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.note{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 11px;margin-top:10px}
.dl-row{display:flex;gap:10px;font-size:14px;padding:5px 0;align-items:baseline}
.dl-row b{min-width:64px;font-size:12px;color:var(--text3);font-weight:600}
.empty{text-align:center;padding:2rem;font-size:14px;color:var(--text3)}
.loadrow{text-align:center;padding:1.5rem;font-size:14px;color:var(--text3)}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--text);color:#fff;font-size:14px;padding:11px 18px;border-radius:10px;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}

/* KNOWLEDGE */
#pg-kw{background:var(--bg)}
.kwtop{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem}
.kwtopin{max-width:1100px;margin:0 auto;height:50px;display:flex;align-items:center;justify-content:space-between}
.kwupd{font-size:14px;color:var(--text3)}
.kwrefresh{font-size:14px;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .2s}
.kwrefresh:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.kwfbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem}
.kwfin{max-width:1100px;margin:0 auto;display:flex;gap:7px;padding:11px 0;overflow-x:auto;scrollbar-width:none}
.kwfin::-webkit-scrollbar{display:none}
.kwfbtn{white-space:nowrap;padding:6px 17px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:14px;font-family:var(--font);cursor:pointer;transition:all .18s;flex-shrink:0}
.kwfbtn:hover{border-color:var(--border2);color:var(--text);background:var(--bg2)}
.kwfbtn.on{font-weight:600;border-color:transparent}
.kwfbtn[data-c="all"].on{background:var(--text);color:#fff}
.kwfbtn[data-c="figma"].on{background:var(--col-figma);color:#fff}
.kwfbtn[data-c="adobe"].on{background:var(--col-adobe);color:#fff}
.kwfbtn[data-c="industry"].on{background:var(--col-industry);color:#fff}
.kwfbtn[data-c="design"].on{background:var(--col-design);color:#fff}
.kwfbtn[data-c="trend"].on{background:var(--col-trend);color:#fff}
.kwfbtn[data-c="frontend"].on{background:var(--col-frontend);color:#fff}
.kwfbtn[data-c="ai"].on{background:var(--col-ai);color:#fff}
.kwmain{max-width:1100px;margin:0 auto;padding:26px 1.5rem}
.kwmeta{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.kwmetatitle{font-family:var(--ftitle);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.kwmetacnt{font-size:13px;color:var(--text3)}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.kwcard{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;animation:fadeup .35s ease both}
.kwcard:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.07);border-color:var(--border2)}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.kwbar{height:3px}
.kwbody{padding:17px 19px;flex:1;display:flex;flex-direction:column;gap:10px}
.kwtop2{display:flex;justify-content:space-between;align-items:center}
.kwchip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px}
.kwdate{font-size:13px;color:var(--text3)}
.kwtitle{font-family:var(--ftitle);font-size:16px;font-weight:700;line-height:1.5;color:var(--text);word-break:keep-all}
.kwsummary{font-size:14px;color:var(--text2);line-height:1.7;word-break:keep-all;flex:1}
.kwkws{display:flex;flex-wrap:wrap;gap:5px}
.kwtag{font-size:13px;padding:3px 9px;border-radius:4px;background:var(--bg2);color:var(--text3);border:1px solid var(--border)}
.kwfoot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:auto}
.kwsrc{font-size:13px;color:var(--text3)}
.kwmore{font-size:13px;font-weight:600;color:var(--accent)}
.kwcard-figma .kwbar{background:var(--col-figma)}
.kwcard-adobe .kwbar{background:var(--col-adobe)}
.kwcard-industry .kwbar{background:var(--col-industry)}
.kwcard-design .kwbar{background:var(--col-design)}
.kwcard-trend .kwbar{background:var(--col-trend)}
.kwcard-frontend .kwbar{background:var(--col-frontend)}
.kwcard-ai .kwbar{background:var(--col-ai)}
.chip-figma{background:var(--bg-figma);color:var(--col-figma)}
.chip-adobe{background:var(--bg-adobe);color:var(--col-adobe)}
.chip-industry{background:var(--bg-industry);color:var(--col-industry)}
.chip-design{background:var(--bg-design);color:var(--col-design)}
.chip-trend{background:var(--bg-trend);color:var(--col-trend)}
.chip-frontend{background:var(--bg-frontend);color:var(--col-frontend)}
.chip-ai{background:var(--bg-ai);color:var(--col-ai)}
.kwloading{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 3px;animation:dot 1.2s infinite;opacity:.3}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-7px);opacity:1}}

/* KW MODAL */
.kwmovl{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:500;align-items:center;justify-content:center;padding:20px}
.kwmovl.on{display:flex}
.kwmpanel{background:var(--white);border:1px solid var(--border);border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.14);animation:mIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.kwmacc{height:4px;border-radius:16px 16px 0 0}
.kwmin{padding:26px 28px 28px}
.kwmhd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.kwmmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kwmclose{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);transition:background .15s}
.kwmclose:hover{background:var(--border);color:var(--text)}
.kwmdate{font-size:14px;color:var(--text3)}
.kwmtitle{font-family:var(--ftitle);font-size:20px;font-weight:800;line-height:1.45;color:var(--text);word-break:keep-all;margin:0 0 7px}
.kwmsrcrow{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.kwmsrcdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kwmsrctxt{font-size:14px;color:var(--text3)}
.kwmdiv{border:none;border-top:1px solid var(--border);margin:18px 0}
.kwmlbl{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin:0 0 9px}
.kwmsum{font-size:16px;color:var(--text);line-height:1.85;word-break:keep-all}
.kwmpts{list-style:none;display:flex;flex-direction:column;gap:10px}
.kwmpts li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--text2);line-height:1.65}
.kwmpt-dot{width:7px;height:7px;border-radius:50%;margin-top:8px;flex-shrink:0}
.kwmkws{display:flex;flex-wrap:wrap;gap:6px}
.kwmkw{font-size:14px;padding:5px 12px;border-radius:20px;background:var(--bg2);color:var(--text2);border:1px solid var(--border)}
.kwmfoot{display:flex;justify-content:space-between;align-items:center;padding-top:18px;border-top:1px solid var(--border);margin-top:5px}
.kwmgo{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:11px 22px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-family:var(--font);border:none;cursor:pointer;transition:background .18s,transform .15s}
.kwmgo:hover{background:#4F46E5;transform:translateY(-1px)}
.kwmshare{font-size:14px;color:var(--text2);background:var(--white);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;cursor:pointer;font-family:var(--font);transition:all .15s}
.kwmshare:hover{border-color:var(--border2);background:var(--bg2)}

@media(max-width:640px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .kwgrid{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .gtab span{display:none}
}

/* ══════════════ 유틸 ══════════════ */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
document.getElementById('gdate').textContent = TODAY.getFullYear()+'.'+(TODAY.getMonth()+1)+'.'+TODAY.getDate();

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('on');
  setTimeout(function(){ el.classList.remove('on'); },2200);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ══════════════ 페이지 전환 ══════════════ */
var kwInited=false;
function goPage(id){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('on'); });
  document.querySelectorAll('.gtab').forEach(function(t){ t.classList.remove('on'); });
  document.getElementById('pg-'+id).classList.add('on');
  document.getElementById('tab-'+id).classList.add('on');
  if(id==='kw' && !kwInited){ kwLoad(); kwInited=true; }
}

var $=function(s){return document.querySelector(s);};
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function sbToday(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function sbDiff(a,b){return Math.round((fromISO(b)-fromISO(a))/86400000);}
function fmtMD(s){if(!s)return'';var d=fromISO(s);return (d.getMonth()+1)+'/'+d.getDate();}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

var RM_BASE='http://10.30.100.24/issues/';
var BIZ=['T클래스','해법수학교실','닥터매쓰','스마트러닝','독서논술','FC 영어','FC 수학','마케팅','기타'];
var BIZKEY={'T클래스':['t클래스','티클래스'],'해법수학교실':['수학교실'],'닥터매쓰':['닥터매쓰'],'스마트러닝':['스마트러닝','공동구매'],'독서논술':['독서논술','해법독서','논술','세계사'],'FC 영어':['fc영어','fc 영어'],'FC 수학':['fc수학','fc 수학'],'마케팅':['마케팅','카드뉴스']};

 {name:'김수영',nick:'soo',emoji:'🙈',role:'Designer',c1:'#FFB02E',c2:'#FF7A00',active:true,visible:true},
 {name:'김미리',nick:'havefunlife',emoji:'🧸',role:'Designer',c1:'#35E0A1',c2:'#00BFCB',active:true,visible:true},

 {name:'양동준',nick:'dongjun',emoji:'🐨',role:'Publisher',c1:'#56A4FF',c2:'#8B5CF6',active:true,visible:true}
];
/* 대한민국 공식 공휴일 — 연도가 바뀌면 이 표를 갱신해야 합니다 (대체공휴일 포함, 정부 발표 기준으로 매년 업데이트 필요) */
var KR_HOLIDAYS={
 '2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴',
 '2026-03-01':'삼일절','2026-03-02':'대체공휴일(삼일절)','2026-05-01':'근로자의 날','2026-05-05':'어린이날',
 '2026-05-24':'부처님오신날','2026-05-25':'대체공휴일(부처님오신날)','2026-06-03':'지방선거일','2026-06-06':'현충일',
 '2026-08-15':'광복절','2026-08-17':'대체공휴일(광복절)',
 '2026-09-24':'추석 연휴','2026-09-25':'추석','2026-09-26':'추석 연휴',
 '2026-10-03':'개천절','2026-10-05':'대체공휴일(개천절)','2026-10-09':'한글날','2026-12-25':'성탄절'
};
function holidayName(dISO){return KR_HOLIDAYS[dISO]||'';}
function isOffDay(dISO){var dow=fromISO(dISO).getDay();return dow===0||dow===6||!!KR_HOLIDAYS[dISO];}
function splitOffRuns(si,ei,idxToISO){
  var runs=[],curS=null;
  for(var d=si;d<=ei;d++){
    if(isOffDay(idxToISO(d))){
      if(curS!==null){runs.push([curS,d-1]);curS=null;}
    }else{
      if(curS===null)curS=d;
    }
  }
  if(curS!==null)runs.push([curS,ei]);
  if(!runs.length)runs.push([si,ei]);
  return runs;
}
var sb=loadSbState();
function loadSbState(){
  try{var raw=localStorage.getItem(SB_LS);if(raw){var s=JSON.parse(raw);if(s&&s.members)return s;}}catch(e){}
  if(localStorage.getItem(SB_FLAG)){return sbBlank();}
  localStorage.setItem(SB_FLAG,'1');
  return sbSeed();
}
function sbBlank(){return {members:JSON.parse(JSON.stringify(DEFAULT_MEMBERS)),projects:[],tasks:[],reviews:[],vacations:[],ui:{solo:true},updatedAt:''};}

function sbSave(){delete sb._seed;sb.updatedAt=new Date().toISOString();sbStore();setSbDirty(true);}

  s._seed=true;

/* 텍스트 어디든 박힌 날짜 토큰(YYYY.MM.DD / MM.DD / M/D)을 찾아 ISO 문자열 배열로 반환 */
function extractDatesFromText(text,ctxYear){
  var re=/(\d{4})[.\-](\d{1,2})[.\-](\d{1,2})|(\d{1,2})[\/](\d{1,2})|(\d{1,2})\.(\d{1,2})(?!\d)|~\s*(\d{1,2})(?!\d)(?!\s*[\/.]\d)/g;
  var out=[],m,lastMonth=null;
  while((m=re.exec(text))){

      var y=+m[1],mo=+m[2],d=+m[3];
      if(mo>=1&&mo<=12&&d>=1&&d<=31){out.push(y+'-'+pad(mo)+'-'+pad(d));lastMonth=mo;}
      continue;
    }
    if(m[8]){
      var d4=+m[8];
      if(lastMonth&&d4>=1&&d4<=31)out.push((ctxYear||sbToday().getFullYear())+'-'+pad(lastMonth)+'-'+pad(d4));
      continue;
    }
    var mo2=m[4]?+m[4]:+m[6],d2=m[4]?+m[5]:+m[7];
    if(mo2<1||mo2>12||d2<1||d2>31)continue;
    out.push(ctxYear?(ctxYear+'-'+pad(mo2)+'-'+pad(d2)):inferDate(mo2,d2));
    lastMonth=mo2;
  }

}

}

      var base=lastEnd[curTag||'_'];
      if(base&&base<r.end)start=iso(addD(fromISO(base),1));
      else{var t0=tISO();start=(t0<=r.end)?t0:r.end;}
    }
    lastEnd[curTag||'_']=r.end;
    items.push({title:title,tag:curTag||'기타',owner:curOwner,round:curRound,start:start,end:r.end});
    return true;
  }
  txt.split(/\r?\n/).forEach(function(raw){
    var line=raw.trim();
    if(!line||/^[=\-_~·＝]{3,}$/.test(line))return;
    var m=line.match(/^[<\[〈（(]\s*([^:：>\]〉）)]+?)(?:\s*[:：]\s*([^>\]〉）)]+?))?\s*[>\]〉）)]$/);
    if(m){curTag=canonTag(m[1]);curOwner=m[2]?normName(m[2]):guessOwnerByTag(canonTag(m[1]));curRound='';return;}
    m=line.match(/^[-*·•]?\s*(\d+)\s*차\s*$/);
    if(m){curRound=m[1]+'차';return;}
    m=line.match(/^[-*·•]?\s*(\d+)\s*차\s*[:：]?\s+(.+)$/);
    if(m){curRound=m[1]+'차';line=m[2];}
    m=line.match(/^[-*·•]?\s*(.+?)\s*[:：]\s*(.*\d.*)$/);
    if(m&&pushItem(m[1].trim(),m[2]))return;
    m=line.match(/^[-*·•]?\s*(.+?)\s+([~∼]\s*\S+|\S*\d{1,2}[\/.]\d{1,2}\S*(?:\s*[~∼]\s*\S+)?)$/);
    if(m&&/\d{1,2}[\/.]\d{1,2}|[~∼]/.test(m[2]))pushItem(m[1].trim(),m[2]);
  });
  return items;
}
/* 리뷰·회의 일정 공지 텍스트 인식 — "일시:"/"시간:" 줄을 기준(anchor)으로 삼아
   앞으로는 제목을, 뒤로는 장소·참석자를 찾는다. <태그:담당자> 묶음 표시가 없는
   순수 회의 공지 형태라 parseCheck와는 다른 전용 인식기를 둔다. */
var RV_ANCHOR_RE=/^[-*·•]?\s*(일시|시간)\s*[:：]\s*(.+)$/;
var RV_LOC_RE=/^[-*·•]?\s*장소\s*[:：]\s*(.+)$/;
var RV_ATTEND_RE=/^[-*·•]?\s*(참석자|참석\s*요청자|담당자)\s*[:：]\s*(.+)$/;
var RV_LABEL_RE=/^[-*·•]?\s*(일시|시간|장소|참석자|참석\s*요청자|담당자)\s*[:：]/;
var RV_BRACKET_RE=/^[\[〈(【][^\]〉)】]*[\]〉)】]$/;
var RV_REJECT_TITLE_RE=/니다\.?\s*$/; // "…확정하고자 합니다." 같은 문장은 제목 후보에서 제외
function extractReviewDate(s){
  var m=s.match(/(\d{4})\s*[.\-]\s*(\d{1,2})\s*[.\-]\s*(\d{1,2})/);
  if(m){var y=+m[1],mo=+m[2],d=+m[3];if(mo>=1&&mo<=12&&d>=1&&d<=31)return y+'-'+pad(mo)+'-'+pad(d);}
  m=s.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(m){var mo2=+m[1],d2=+m[2];if(mo2>=1&&mo2<=12&&d2>=1&&d2<=31)return inferDate(mo2,d2);}
  m=s.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)/);
  if(m){var mo3=+m[1],d3=+m[2];if(mo3>=1&&mo3<=12&&d3>=1&&d3<=31)return inferDate(mo3,d3);}
  return '';
}
function extractReviewTime(s){
  var m=s.match(/(오전|오후)\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
  if(m)return m[1]+' '+m[2]+'시'+(m[3]?' '+m[3]+'분':'');
  m=s.match(/\b(\d{1,2}):(\d{2})\b/);
  if(m)return m[1]+':'+m[2];
  return '';
}
function reviewTitleBackward(lines,idx){
  for(var i=idx-1,steps=0;i>=0&&steps<6;i--,steps++){
    var l=lines[i];
    if(!l)continue;
    if(RV_BRACKET_RE.test(l))continue;
    if(RV_LABEL_RE.test(l))return '';
    if(RV_REJECT_TITLE_RE.test(l))return '';
    return l.replace(/^\[[^\]]*\]\s*/,'').trim();
  }
  return '';
}
function parseReviewMeetings(txt){
  var lines=txt.split(/\r?\n/).map(function(l){return l.trim();});
  var out=[];
  for(var i=0;i<lines.length;i++){
    var m=lines[i].match(RV_ANCHOR_RE);
    if(!m)continue;
    var content=m[2];
    var date=extractReviewDate(content),time=extractReviewTime(content);
    var loc='',attendees='';
    for(var j=i+1;j<lines.length&&j<i+8;j++){
      var lj=lines[j];
      if(!lj)continue;
      if(RV_ANCHOR_RE.test(lj))break;
      if(!loc){var lm=lj.match(RV_LOC_RE);if(lm){loc=lm[1].trim();continue;}}
      if(!attendees){var am=lj.match(RV_ATTEND_RE);if(am){attendees=am[2].split(/[,，、]/).map(function(s){return s.trim();}).filter(Boolean).join(', ');continue;}}
      if(loc&&attendees)break;
    }
    var title=reviewTitleBackward(lines,i);
    if(date||time||loc||attendees||title){
      out.push({title:title,date:date,time:time,location:loc,attendees:attendees});
    }
  }
  return out;
}
function normT(t){return String(t).replace(/\[[^\]]*\]/g,'').replace(/[\s·\-–_]/g,'').toLowerCase();}
function chainCandidates(title,excludeId){
  var n=normT(title);if(n.length<4)return [];
  return sb.tasks.filter(function(t){
    if(t.id===excludeId)return false;
    var o=normT(t.title);
    return o.length>=4&&(o.indexOf(n)>=0||n.indexOf(o)>=0);
  });
}

/* ══════════════ 요약 계산 ══════════════ */
function tISO(){return iso(sbToday());}
function weekRange(){var t=sbToday();var mon=addD(t,-((t.getDay()+6)%7));return [iso(mon),iso(addD(mon,6))];}
function chainGroups(){
  var g={};
  sb.tasks.forEach(function(t){if(t.chain){(g[t.chain]=g[t.chain]||[]).push(t);}});
  for(var k in g)g[k].sort(function(a,b){return a.start<b.start?-1:1;});
  return g;
}
function allHandoffs(){
  var hs=[];
  sb.projects.forEach(function(p){
    if(p.done)return;
    for(var i=0;i<p.phases.length-1;i++){
      var a=p.phases[i],b=p.phases[i+1];
      hs.push({date:a.end,label:a.name+'→'+b.name+' 전달',owner:a.owner,title:p.title,url:null,ref:{type:'project',id:p.id}});
    }
  });
  var g=chainGroups();
  for(var k in g){
    var arr=g[k].filter(function(t){return !t.done;});
    var full=g[k];
    for(var i=0;i<full.length-1;i++){
      if(full[i].done)continue;
      hs.push({date:full[i].end,label:full[i].tag+'→'+full[i+1].tag+' 전달',owner:full[i].owner,title:full[i].title,url:full[i].url,rm:full[i].rm,ref:{type:'task',id:full[i].id}});
    }
    var last=full[full.length-1];
    if(last&&!last.done&&last.tag==='퍼블')hs.push({date:last.end,label:'퍼블→개발 전달',owner:last.owner,title:last.title,url:last.url,rm:last.rm,ref:{type:'task',id:last.id}});
  }
  sb.tasks.forEach(function(t){
    if(t.chain||t.done||t.tag!=='퍼블')return;
    hs.push({date:t.end,label:'퍼블→개발 전달',owner:t.owner,title:t.title,url:t.url,rm:t.rm,ref:{type:'task',id:t.id}});
  });
  hs.sort(function(a,b){return a.date<b.date?-1:1;});
  return hs;
}
function listOpens(){
  var wr=weekRange(),rows=[];
  sb.projects.forEach(function(p){
    if(p.done)return;
    if(p.open&&p.open>=wr[0]&&p.open<=wr[1])rows.push({title:p.title,biz:p.biz,date:p.open,kind:'오픈'});
    if(p.inspect&&p.inspect>=wr[0]&&p.inspect<=wr[1])rows.push({title:p.title,biz:p.biz,date:p.inspect,kind:'검수'});
  });
  rows.sort(function(a,b){return a.date<b.date?-1:1;});
  return rows;
}
function listHandoffsImminent(){
  var t=tISO();
  return allHandoffs().filter(function(h){var d=sbDiff(t,h.date);return d>=-7&&d<=2;});
}
function listOngoing(){
  var t=tISO(),rows=[];
  sb.projects.forEach(function(p){
    if(p.done||!p.phases.length)return;
    var s=p.phases[0].start,e=p.open||p.phases[p.phases.length-1].end;
    if(s<=t&&t<=e)rows.push({kind:'타임라인',title:p.title,owner:'',sub:fmtMD(s)+'~'+(p.open?'Open '+fmtMD(p.open):fmtMD(e)),url:null,ref:{type:'project',id:p.id}});
  });
  sb.tasks.forEach(function(tk){
    if(tk.done)return;
    var inSpan=tk.start&&tk.end&&tk.start<=t&&t<=tk.end;
    var going=(tk.status||'').indexOf('진행')>=0;
    if(inSpan||going)rows.push({kind:'단건',title:tk.title,owner:tk.owner,sub:fmtMD(tk.start)+'~'+fmtMD(tk.end),url:tk.url,rm:tk.rm,ref:{type:'task',id:tk.id}});
  });
  return rows;
}
function listIssues(){
  var rows=[];
  function pull(item,type){
    (item.issues||[]).forEach(function(is){
      if(!is.done)rows.push({issue:is,host:item,type:type});
    });
  }
  sb.projects.forEach(function(p){pull(p,'project');});
  sb.tasks.forEach(function(t){pull(t,'task');});
  return rows;
}
function listRmWait(){
  var seen={},rows=[];
  sb.tasks.forEach(function(t){
    if(t.done||t.rm)return;
    var key=t.chain||t.id;
    if(seen[key])return;seen[key]=1;
    var group=t.chain?(chainGroups()[t.chain]||[t]):[t];
    var minStart=group.reduce(function(a,b){return a.start<b.start?a:b;}).start;
    rows.push({title:t.title,owner:t.owner,tag:t.tag,round:t.round,start:minStart,ref:{type:'task',id:t.id}});
  });
  rows.sort(function(a,b){return a.start<b.start?-1:1;});
  return rows;
}
function listReviews(){
  var rows=[];
  (sb.reviews||[]).forEach(function(r){
    rows.push({id:r.id,title:r.title,date:r.date,time:r.time,location:r.location,attendees:r.attendees,standalone:true});
  });
  sb.projects.forEach(function(p){
    (p.reviews||[]).forEach(function(r){
      rows.push({id:r.id,title:r.title,date:r.date,time:r.time,location:r.location,attendees:r.attendees,url:r.url,projectTitle:p.title,projectId:p.id});
    });
  });
  rows.sort(function(a,b){return (a.date||'9999')<(b.date||'9999')?-1:1;});
  return rows;
}
function listReviewsUpcoming(){
  var t=tISO();
  return listReviews().filter(function(r){return !r.date||sbDiff(t,r.date)>=-3;});
}
/* 젤 상단 "오늘 확인할 이슈" 요약 — 오늘 마감(업무/오픈/검수/전달)·오늘 회의·리뷰,
   그리고 이미 지난(놓친) 업무를 한눈에 모아 보여준다. */
function todayDueTasks(){
  var t=tISO(),due=[],missed=[];
  function put(list,row){list.push(row);}
  sb.tasks.forEach(function(tk){
    if(tk.done||!tk.end)return;
    var row={title:tk.title,owner:tk.owner,meta:tk.tag,date:tk.end,rm:tk.rm,url:tk.url,ref:{type:'task',id:tk.id},doneToggle:true};
    if(tk.end===t)put(due,row);else if(tk.end<t)put(missed,row);
  });
  sb.projects.forEach(function(p){
    if(p.done)return;
    if(p.open){
      var r1={title:p.title,owner:'',meta:'오픈',date:p.open,ref:{type:'project',id:p.id},doneToggle:true};
      if(p.open===t)put(due,r1);else if(p.open<t)put(missed,r1);
    }
    if(p.inspect){
      var r2={title:p.title,owner:'',meta:'검수',date:p.inspect,ref:{type:'project',id:p.id},doneToggle:true};
      if(p.inspect===t)put(due,r2);else if(p.inspect<t)put(missed,r2);
    }
  });
  allHandoffs().forEach(function(h){
    var row={title:h.title,owner:h.owner,meta:h.label,date:h.date,rm:h.rm,url:h.url,ref:h.ref,doneToggle:false};
    if(h.date===t)put(due,row);else if(h.date<t)put(missed,row);
  });
  due.sort(function(a,b){return a.title<b.title?-1:1;});
  missed.sort(function(a,b){return a.date<b.date?-1:1;});
  return {due:due,missed:missed};
}
function todayMeetings(){
  var t=tISO();
  return listReviews().filter(function(r){return r.date===t;}).map(function(r){
    return {title:r.title||'리뷰 일정',owner:'',meta:[r.time,r.location].filter(Boolean).join(' · '),date:r.date};
  });
}
function tdyRow(r,badgeHtml){
  var rmChip=r.rm?' <a href="'+esc(r.url||'')+'" target="_blank" rel="noopener">#'+esc(r.rm)+'</a>':'';
  var doneBtn=(r.doneToggle&&r.ref)?'<button class="icbtn" data-act="done" data-type="'+r.ref.type+'" data-id="'+r.ref.id+'" title="완료로 표시해서 목록에서 지워요">완료 처리</button>':'';
  return '<div class="pn-row"><span class="pn-title">'+esc(r.title)+rmChip+'</span>'+(r.owner?miniPill(r.owner):'')+(r.meta?'<span class="pn-sub">'+esc(r.meta)+'</span>':'')+badgeHtml+doneBtn+'</div>';
}
function renderTodayBox(){
  var box=$('#sbToday');if(!box)return;
  var dm=todayDueTasks(),due=dm.due,missed=dm.missed,meet=todayMeetings();
  var total=due.length+missed.length+meet.length;
  if(!total){
    box.className='panel todaybox ok';
    box.innerHTML='<div class="tdy-head ok"><i class="ti ti-circle-check"></i> 오늘 마감·회의·지연 이슈가 없어요</div>';
    return;
  }
  box.className='panel todaybox'+(missed.length?' warn':'');
  var body='';
  if(due.length)body+='<div class="tdy-glabel">오늘 마감 · '+due.length+'건</div>'+due.map(function(r){return tdyRow(r,'<span class="dchip">D-0</span>');}).join('');
  if(meet.length)body+='<div class="tdy-glabel">오늘 회의·리뷰 · '+meet.length+'건</div>'+meet.map(function(r){return tdyRow(r,'<span class="dchip inspect">오늘</span>');}).join('');
  if(missed.length)body+='<div class="tdy-glabel">놓친 업무 · '+missed.length+'건</div>'+missed.map(function(r){return tdyRow(r,'<span class="dchip late">D+'+(-sbDiff(tISO(),r.date))+' 지연</span>');}).join('');
  box.innerHTML='<div class="tdy-head'+(missed.length?' warn':'')+'"><i class="ti ti-alert-triangle"></i> 오늘 확인할 이슈 · 총 '+total+'건</div>'+body;
}

    html=going.length?going.map(function(g){
      var link=g.rm?' <a href="'+esc(g.url)+'" target="_blank" rel="noopener">#'+esc(g.rm)+'</a>':'';
      return '<div class="pn-row"><span class="kchip">'+g.kind+'</span><span class="pn-title">'+esc(g.title)+link+' <span class="dchip open" style="margin-left:6px">'+esc(g.sub)+'</span></span>'+(g.owner?miniPill(g.owner):'')+'</div>';
    }).join(''):'<div class="pn-empty">진행 중인 업무가 없습니다.</div>';
  }
  if(selCard==='issue'){
    html=iss.length?iss.map(function(r){
      return '<div class="pn-row"><label class="issue-row"><input type="checkbox" data-act="issue-done" data-type="'+r.type+'" data-host="'+r.host.id+'" data-iid="'+r.issue.id+'"><span>'+esc(r.issue.text)+'</span></label><span class="pn-sub" style="margin-left:auto">'+esc(r.host.title)+' · '+fmtMD(r.issue.date)+'</span></div>';
    }).join(''):'<div class="pn-empty">미해결 이슈가 없습니다.</div>';
  }
  if(selCard==='review'){
    html=revs&&revs.length?revs.map(function(r){
      var strong=[r.date?(fmtMD(r.date)+(r.time?' '+r.time:'')):'',r.location].filter(Boolean).join(' · ');
      var attend=r.attendees?'참석 '+r.attendees:'';
      var link=r.url?' <a href="'+esc(r.url)+'" target="_blank" rel="noopener">문서 ↗</a>':'';
      var projChip=r.projectTitle?'<span class="kchip">'+esc(r.projectTitle)+'</span>':'';
      var delBtn=r.standalone?'<button class="icbtn" data-act="review-del" data-id="'+r.id+'" title="삭제">✕</button>':'';
      return '<div class="pn-row"><span class="pn-title">'+esc(r.title||'리뷰 일정')+link+'</span>'+projChip+(strong?'<span class="pn-strong">'+esc(strong)+'</span>':'')+(attend?'<span class="pn-sub">'+esc(attend)+'</span>':'')+delBtn+(r.date?dBadge(r.date):'')+'</div>';
    }).join(''):'<div class="pn-empty">예정된 리뷰·피드백 일정이 없습니다.</div>';
  }
  p.innerHTML=html;p.hidden=false;
}

/* ══════════════ 렌더: 타임라인 ══════════════ */
function phCls(name){
  if(name==='디자인')return 'ph-design';
  if(name==='퍼블')return 'ph-pub';
  if(name==='기획')return 'ph-plan';
  if(name==='개발')return 'ph-dev';
  return 'ph-qa';
}
function segHtml(cls,flex,label,titleAttr){
  return '<div class="seg '+cls+'" style="flex:'+flex+'" title="'+esc(titleAttr||label)+'">'+label+'</div>';
}
function nextHandoffLine(hs){
  var t=tISO(),up=null,late=null;
  hs.forEach(function(h){
    var d=sbDiff(t,h.date);
    if(d<0&&d>=-7&&!late)late=h;
    if(d>=0&&(!up||h.date<up.date))up=h;
  });
  var h=late||up;
  if(!h)return '';
  var d=sbDiff(t,h.date);
  var cls=d<0?'ho-line late':'ho-line';
  var txt=d<0?esc(h.label)+' '+fmtMD(h.date)+' · '+(-d)+'일 지연':esc(h.label)+' '+fmtMD(h.date)+' · D-'+d;
  return '<span class="'+cls+'">⇄ '+txt+'</span>';
}
function issuesHtml(item,type){
  var arr=item.issues||[];
  if(!arr.length)return '';
  return '<div class="issue-list">'+arr.map(function(is){
    return '<label class="issue-row'+(is.done?' done':'')+'"><input type="checkbox" '+(is.done?'checked':'')+' data-act="issue-done" data-type="'+type+'" data-host="'+item.id+'" data-iid="'+is.id+'"><span>'+esc(is.text)+' <em style="color:var(--text3);font-style:normal;font-size:11px">'+fmtMD(is.date)+'</em></span></label>';
  }).join('')+'</div>';
}
function cardActs(type,id,done,noEdit){
  var reopenBtn=done?'<button class="icbtn" data-act="reopen" data-type="'+type+'" data-id="'+id+'">수정요청 재오픈</button>':'';
  var editBtn=noEdit?'':'<button class="icbtn" data-act="edit" data-type="'+type+'" data-id="'+id+'">수정</button>';
  return '<span class="tl-acts">'+reopenBtn+'<button class="icbtn" data-act="issue-add" data-type="'+type+'" data-id="'+id+'">+ 이슈</button>'+editBtn+'<button class="icbtn" data-act="del" data-type="'+type+'" data-id="'+id+'">삭제</button></span>';
}
function projCard(p){
  var total=0;
  p.phases.forEach(function(ph){total+=Math.max(1,sbDiff(ph.start,ph.end)+1);});
  var segs=p.phases.map(function(ph){
    var dur=Math.max(1,sbDiff(ph.start,ph.end)+1);
    var flex=Math.max(.8,dur/Math.max(total,1)*10);
    var labPlain=ph.name+' '+fmtMD(ph.start)+(ph.end!==ph.start?'~'+fmtMD(ph.end):'')+(ph.owner?' · '+ownerDisp(ph.owner):'');
    var rmTag=ph.rm?'<a href="'+esc(RM_BASE+ph.rm)+'" target="_blank" rel="noopener">#'+esc(ph.rm)+'</a> ':'';
    var lab=rmTag+labPlain;
    var tip=p.title+' · '+labPlain+(ph.rm?' · #'+ph.rm:'')+(ph.content?' · '+ph.content:'');
    return segHtml(phCls(ph.name),flex.toFixed(2),lab,tip);
  }).join('');
  var openChip='';
  if(p.open){
    var d=sbDiff(tISO(),p.open);
    openChip='<span class="dchip open">Open '+fmtMD(p.open)+(d>=0?' · D-'+d:' · 오픈됨')+'</span>';
  }
  if(p.inspect){
    var di=sbDiff(tISO(),p.inspect);
    openChip+='<span class="dchip inspect">검수 '+fmtMD(p.inspect)+(di>=0?' · D-'+di:' · 지남')+'</span>';
  }
  var reviews=p.reviews||[];
  var reviewChips=reviews.slice().sort(function(a,b){return a.date<b.date?-1:1;}).map(function(rv){
    var dr=sbDiff(tISO(),rv.date);
    return '<span class="dchip review" title="'+esc(rv.title||'리뷰 일정')+'">리뷰 '+fmtMD(rv.date)+(dr>=0?' · D-'+dr:' · 지남')+'</span>';
  }).join('');
  var hs=allHandoffs().filter(function(h){return h.ref.type==='project'&&h.ref.id===p.id;});
  return '<div class="tl-card'+(p.done?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(p.done?'checked':'')+' data-act="done" data-type="project" data-id="'+p.id+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(p.title)+'</span>'
    +openChip+reviewChips
    +(p.reopen?'<span class="chip reopen">⟳ 재오픈 이력</span>':'')
    +cardActs('project',p.id,p.done)+'</div>'
    +'<div class="bar">'+segs+'</div>'
    +'<div class="tl-foot">'+(p.done?'':nextHandoffLine(hs))+'</div>'
    +issuesHtml(p,'project')+'</div>';
}
function taskSeg(t,flex){
  var link=t.rm?'<a href="'+esc(t.url)+'" target="_blank" rel="noopener">#'+esc(t.rm)+'</a> ':'◌ ';
  var lab=link+esc(t.tag)+(t.round?' '+esc(t.round):'')+' '+fmtMD(t.start)+'~'+fmtMD(t.end)+' · '+ownerDisp(t.owner);
  return '<div class="seg '+phCls(t.tag)+'" style="flex:'+flex+'" title="'+esc(t.title)+'">'+lab
    +'<button class="seg-edit" data-act="edit" data-type="task" data-id="'+t.id+'" title="'+esc(t.tag)+' 단계만 따로 수정">✎</button></div>';
}
function chainCard(arr){
  var head=arr[0],allDone=arr.every(function(t){return t.done;});
  var segs=arr.map(function(t){return taskSeg(t,'1');}).join('');
  var last=arr[arr.length-1];
  if(last.tag==='퍼블')segs+='<div class="seg ph-stub" style="flex:.7">개발 전달 '+fmtMD(last.end)+'<button class="seg-edit" data-act="edit" data-type="task" data-id="'+last.id+'" title="전달일(퍼블 완료기한) 수정">✎</button></div>';
  var hs=allHandoffs().filter(function(h){return arr.some(function(t){return h.ref.type==='task'&&h.ref.id===t.id;});});
  var reopen=arr.some(function(t){return t.reopen;});
  return '<div class="tl-card'+(allDone?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(allDone?'checked':'')+' data-act="done" data-type="chain" data-id="'+head.chain+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(head.title)+'</span>'
    +'<span class="chip solo">연결 '+arr.length+'건</span>'
    +(arr.some(function(t){return !t.rm&&!t.done;})?'<span class="chip rmwait">레드마인 대기</span>':'')
    +(reopen?'<span class="chip reopen">⟳ 재오픈 이력</span>':'')
    +cardActs('task',last.id,allDone,true)+'</div>'
    +'<div class="bar">'+segs+'</div>'
    +'<div class="tl-foot">'+(allDone?'':nextHandoffLine(hs))+'</div>'
    +arr.map(function(t){return issuesHtml(t,'task');}).join('')+'</div>';
}
function soloCard(t){
  var segs=taskSeg(t,'2')+'<div class="seg ph-stub" style="flex:1">개발 전달 '+fmtMD(t.end)+'<button class="seg-edit" data-act="edit" data-type="task" data-id="'+t.id+'" title="전달일(완료기한) 수정">✎</button></div>';
  var hs=allHandoffs().filter(function(h){return h.ref.type==='task'&&h.ref.id===t.id;});
  return '<div class="tl-card'+(t.done?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(t.done?'checked':'')+' data-act="done" data-type="task" data-id="'+t.id+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(t.title)+'</span>'
    +'<span class="chip solo">퍼블 단독</span>'
    +(!t.rm&&!t.done?'<span class="chip rmwait">레드마인 대기</span>':'')
    +(t.reopen?'<span class="chip reopen">⟳ 재오픈 이력</span>':'')
    +cardActs('task',t.id,t.done,true)+'</div>'
    +'<div class="bar">'+segs+'</div>'
    +'<div class="tl-foot">'+(t.done?'':nextHandoffLine(hs))+'</div>'
    +issuesHtml(t,'task')+'</div>';
}
function renderSbTimeline(){
  var g=chainGroups(),html='';
  var items=[];
  sb.projects.forEach(function(p){
    var s=p.phases.length?p.phases[0].start:'9999';
    items.push({sort:s,html:projCard(p)});
  });
  for(var k in g)items.push({sort:g[k][0].start,html:chainCard(g[k])});
  if(sb.ui.solo){
    sb.tasks.forEach(function(t){
      if(!t.chain&&t.tag==='퍼블')items.push({sort:t.start,html:soloCard(t)});
    });
  }
  items.sort(function(a,b){return a.sort<b.sort?-1:1;});
  html=items.map(function(i){return i.html;}).join('');
  $('#sbTimeline').innerHTML=html||'<div class="empty">아직 등록된 타임라인 업무가 없습니다.<br>메일 본문을 붙여넣으면 디자인→퍼블→개발 일정이 자동으로 만들어져요.</div>';
}

/* ══════════════ 렌더: 달력 ══════════════ */
var calY=sbToday().getFullYear(),calM=sbToday().getMonth();
function collectBars(){
  var bars=[];
  sb.tasks.forEach(function(t){
    if(!t.start||!t.end)return;
    bars.push({s:t.start,e:t.end,owner:t.owner,label:(t.rm?'#'+t.rm+' ':'◌ ')+(t.round?t.round+' ':'')+t.title,done:t.done,type:'task',id:t.id});
  });
  sb.projects.forEach(function(p){
    p.phases.forEach(function(ph){
      if(!sbMember(ph.owner))return;
      bars.push({s:ph.start,e:ph.end,owner:ph.owner,label:p.title+' · '+ph.name,done:p.done,type:'project',id:p.id});
    });
  });
  return bars.filter(function(b){var m=sbMember(b.owner);return m&&m.visible;});
}
function vacBarsVisible(){
  return (sb.vacations||[]).filter(function(v){var m=sbMember(v.member);return m&&m.visible;})
    .map(function(v){return {s:v.start,e:v.end,owner:v.member,label:'🏖 '+(v.note||'휴가'),done:false,type:'vacation',id:v.id};});
}
function renderCal(){
  $('#sbCalTitle').textContent=calY+'년 '+(calM+1)+'월';
  var first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  var cur=addD(first,-((first.getDay()+6)%7));
  var bars=collectBars().concat(vacBarsVisible()),t=tISO(),html='';
  html+='<div class="cal-dow">'+['월','화','수','목','금','토','일'].map(function(d,i){return '<span class="'+(i>4?'wkend':'')+'">'+d+'</span>';}).join('')+'</div>';
  var any=false;
  while(cur<=last){
    var wkS=iso(cur),wkE=iso(addD(cur,6));
    var dn='<div class="days">';
    for(var i=0;i<7;i++){
      var d=addD(cur,i),inM=d.getMonth()===calM,isT=iso(d)===t,hn=holidayName(iso(d));
      var cls=(inM?'':'out ')+(i>4?'wkend ':'')+(hn?'holiday ':'')+(isT?'today':'');
      dn+='<span class="'+cls.trim()+'"'+(isT?' data-d="'+d.getDate()+'"':'')+(hn?' title="'+esc(hn)+'"':'')+'>'+(isT?'':d.getDate())+'</span>';
    }
    dn+='</div>';
    var wb=bars.filter(function(b){return b.s<=wkE&&b.e>=wkS;}).sort(function(a,b){return a.s<b.s?-1:1;});
    var lanes=[],bh='';
    wb.forEach(function(b){
      var li=-1;
      for(var j=0;j<lanes.length;j++){if(lanes[j]<b.s){li=j;break;}}
      if(li<0){li=lanes.length;lanes.push(b.e);}else{lanes[li]=b.e;}
      var si=Math.max(0,sbDiff(wkS,b.s)),ei=Math.min(6,sbDiff(wkS,b.e));
      var isVac=b.type==='vacation';
      var tip=esc(b.owner+' · '+b.label+' ('+fmtMD(b.s)+'~'+fmtMD(b.e)+')');
      if(isVac){
        var st='grid-column:'+(si+1)+'/'+(ei+2)+';grid-row:'+(li+1)+';';
        bh+='<button class="bar-ev bar-vac" style="'+st+'" data-act="vac-open" title="'+tip+'">'+esc(b.label)+'</button>';
      }else{
        var m=sbMember(b.owner);
        var runs=splitOffRuns(si,ei,function(dd){return iso(addD(cur,dd));});
        runs.forEach(function(run){
          var st2='grid-column:'+(run[0]+1)+'/'+(run[1]+2)+';grid-row:'+(li+1)+';background:linear-gradient(120deg,'+m.c1+','+m.c2+')';
          bh+='<button class="bar-ev'+(b.done?' is-done':'')+'" style="'+st2+'" data-act="bar" data-type="'+b.type+'" data-id="'+b.id+'" title="'+tip+'">'+esc(b.label)+'</button>';
        });
      }
      any=true;
    });
    html+='<div class="week">'+dn+'<div class="lanes">'+bh+'</div></div>';
    cur=addD(cur,7);
  }
  if(!any)html+='<div class="cal-empty">이 달에 표시할 업무가 없습니다. 레드마인 텍스트를 붙여넣어 보세요.</div>';
  $('#sbCal').innerHTML=html;
}

/* ══════════════ 렌더: 팀원별 업무 분포 ══════════════ */
function renderDist(){
  $('#sbCalTitle').textContent=calY+'년 '+(calM+1)+'월';
  var first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),nd=last.getDate();
  var mS=iso(first),mE=iso(last),t=tISO();
  var cols='grid-template-columns:repeat('+nd+',1fr)';
  var bars=collectBars();
  var vacs=sb.vacations||[];
  var days='',colBg='';
  for(var d=1;d<=nd;d++){
    var dt=new Date(calY,calM,d),dow=dt.getDay(),dISO=iso(dt);
    var wk=(dow===0||dow===6),isT=dISO===t,hn=holidayName(dISO);
    var cls=((wk?'wkend ':'')+(hn?'holiday ':'')+(isT?'today':'')).trim();
    days+='<span class="'+cls+'"'+(hn?' title="'+esc(hn)+'"':'')+'>'+d+'</span>';
    colBg+='<span class="'+cls+'"></span>';
  }
  var html='<div class="dist-head"><div class="dist-side"></div><div class="dist-days" style="'+cols+'">'+days+'</div></div>';
  var mems=sb.members.filter(function(m){return m.visible;});
  mems.forEach(function(m){
    var mine=bars.filter(function(b){return sbMember(b.owner)===m&&b.s<=mE&&b.e>=mS;}).sort(function(a,b){return a.s<b.s?-1:1;});
    var going=mine.filter(function(b){return !b.done&&b.s<=t&&t<=b.e;}).length;
    var mvac=vacs.filter(function(v){return v.member===m.name&&v.start<=mE&&v.end>=mS;}).sort(function(a,b){return a.start<b.start?-1:1;});
    var lanes=[],bh='';
    mine.forEach(function(b){
      var li=-1;
      for(var j=0;j<lanes.length;j++){if(lanes[j]<b.s){li=j;break;}}
      if(li<0){li=lanes.length;lanes.push(b.e);}else{lanes[li]=b.e;}
      var si=b.s<mS?1:fromISO(b.s).getDate();
      var ei=b.e>mE?nd:fromISO(b.e).getDate();
      var tip=esc(b.owner+' · '+b.label+' ('+fmtMD(b.s)+'~'+fmtMD(b.e)+')');
      var runs=splitOffRuns(si,ei,function(dd){return iso(new Date(calY,calM,dd));});
      runs.forEach(function(run){
        var st='grid-column:'+run[0]+'/'+(run[1]+1)+';grid-row:'+(li+1)+';background:linear-gradient(120deg,'+m.c1+','+m.c2+')';
        bh+='<button class="bar-ev'+(b.done?' is-done':'')+'" style="'+st+'" data-act="bar" data-type="'+b.type+'" data-id="'+b.id+'" title="'+tip+'">'+esc(b.label)+'</button>';
      });
    });
    var vacBg=mvac.map(function(v){
      var si=v.start<mS?1:fromISO(v.start).getDate();
      var ei=v.end>mE?nd:fromISO(v.end).getDate();
      return '<span style="grid-column:'+si+'/'+(ei+1)+'" data-act="vac-open" title="'+esc(m.name+' 휴가 ('+fmtMD(v.start)+'~'+fmtMD(v.end)+')'+(v.note?' · '+v.note:''))+'"></span>';
    }).join('');
    html+='<div class="dist-row"><div class="dist-side">'+miniPill(m.name)
      +'<span class="dist-cnt">이번 달 <b>'+mine.length+'건</b> · 오늘 '+going+'건 진행</span></div>'
      +'<div class="dist-grid" style="'+cols+'">'
      +'<div class="dist-cols" style="'+cols+'">'+colBg+'</div>'
      +(vacBg?'<div class="dist-vacbg" style="'+cols+'">'+vacBg+'</div>':'')
      +(bh||'')+'</div></div>';
  });
  if(!mems.length)html+='<div class="dist-empty">표시할 팀원이 없습니다. 범례에서 팀원을 켜 주세요.</div>';
  $('#sbDist').innerHTML=html;
}
function renderWorkload(){
  var mode=sb.ui.wl||'dist';
  var bD=$('#wlDist'),bC=$('#wlCal');
  if(bD)bD.classList.toggle('on',mode==='dist');
  if(bC)bC.classList.toggle('on',mode==='cal');

function chainSelHtml(cands,excludeId,currentChain,selAttrs){
  var opts='<option value="">연결 안 함</option>',seen={};
  cands.forEach(function(t){
    seen[t.id]=1;
    opts+='<option value="'+t.id+'" '+(currentChain&&t.chain===currentChain?'selected':'')+'>추천 · #'+esc(t.rm||'?')+' ['+esc(t.tag)+'] '+esc(t.title)+'</option>';
  });
  sb.tasks.filter(function(t){return t.id!==excludeId&&!seen[t.id];}).slice(0,25).forEach(function(t){
    opts+='<option value="'+t.id+'" '+(currentChain&&t.chain===currentChain?'selected':'')+'>#'+esc(t.rm||'?')+' ['+esc(t.tag)+'] '+esc(t.title)+'</option>';
  });
  return '<select '+(selAttrs||'id="rmChain" class="fi"')+'>'+opts+'</select>';
}

      +'<div class="dl-row"><b>상태</b><span>'+esc(t.status||'-')+' · 우선순위 '+esc(t.prio||'-')+(t.done?' · 완료됨':'')+'</span></div>'
      +'<div class="factions"><button class="btn" data-act="done" data-type="task" data-id="'+t.id+'">'+(t.done?'완료 해제':'완료 표시')+'</button>'

    }).join('');

      return '<div class="dl-row"><b>리뷰</b><span>'+esc(r.title)+link+(r.date?' · '+fmtMD(r.date):'')+(meta?' · '+esc(meta):'')+(r.attendees?' · 참석 '+esc(r.attendees):'')+'</span></div>';
    }).join('');
    var pmeta=[(p.open?'Open '+fmtMD(p.open):''),(p.inspect?'검수 '+fmtMD(p.inspect):'')].filter(Boolean).join(' · ');
    openModal('<h3 class="mtitle">'+esc(p.title)+'</h3>'+(pmeta?'<p class="m-sub">'+pmeta+'</p>':'')+rows+revRows2
      +'<div class="factions"><button class="btn" data-act="modal-close">닫기</button><button class="btn pri" data-act="edit" data-type="project" data-id="'+p.id+'">수정</button></div>');

/* ══════════════ 데이터 조작 ══════════════ */
function findTask(id){for(var i=0;i<sb.tasks.length;i++)if(sb.tasks[i].id===id)return sb.tasks[i];return null;}
function findProject(id){for(var i=0;i<sb.projects.length;i++)if(sb.projects[i].id===id)return sb.projects[i];return null;}
function cleanupChains(){
  var g=chainGroups();
  for(var k in g)if(g[k].length<2)g[k].forEach(function(t){t.chain=null;});
}
function toggleDone(type,id){
  if(type==='project'){var p=findProject(id);if(p)p.done=!p.done;}
  else if(type==='chain'){
    var arr=(chainGroups()[id]||[]);
    var allDone=arr.every(function(t){return t.done;});
    arr.forEach(function(t){t.done=!allDone;});
  }
  else{var t=findTask(id);if(t)t.done=!t.done;}
  sbSave();renderSbAll();closeModal();
}
function doReopen(type,id){
  if(type==='project'){var p=findProject(id);if(p){p.done=false;p.reopen=true;}}
  else{
    var t=findTask(id);
    if(t){
      var arr=t.chain?(chainGroups()[t.chain]||[t]):[t];
      arr.forEach(function(x){x.done=false;});
      t.reopen=true;
    }
  }
  sbSave();renderSbAll();toast('수정 요청으로 다시 열었어요');
}
function doDelete(type,id){
  if(type==='project'){
    if(!confirm('이 타임라인을 삭제할까요?'))return;
    sb.projects=sb.projects.filter(function(p){return p.id!==id;});
  }else{
    if(!confirm('이 업무를 삭제할까요?'))return;
    sb.tasks=sb.tasks.filter(function(t){return t.id!==id;});
    cleanupChains();
  }
  sbSave();renderSbAll();toast('삭제했어요');
}

function exportSbJson(){

function importSbJson(file){

      var s=JSON.parse(rd.result);

/* ══════════════ 팀 공유 (GitHub 저장소 동기화) ══════════════
   저장소의 board-data.json을 팀 공유 데이터로 사용.
   읽기는 공개 API라 토큰 없이 동작, 쓰기(팀 공유)만 GitHub 토큰 필요. */
/* Google Apps Script 웹 앱 URL — team-sync-apps-script.gs 배포 후 발급된 /exec URL을 입력.
   비어 있으면 예전 GitHub(board-data.json + 토큰) 방식으로 동작한다. */
var SB_GAS_URL='';
var SB_REPO='soullim/WebDesignTEAM', SB_DATA='board-data.json', SB_BRANCH='main';
var SB_TOKEN_KEY='wdsb_gh_token', SB_DIRTY_KEY='wdsb_dirty';
function ghToken(){return localStorage.getItem(SB_TOKEN_KEY)||'';}
function sbDirty(){return localStorage.getItem(SB_DIRTY_KEY)==='1';}
function setSbDirty(v){if(v)localStorage.setItem(SB_DIRTY_KEY,'1');else localStorage.removeItem(SB_DIRTY_KEY);syncStatus();}
function fmtStamp(s){if(!s)return'';var d=new Date(s);return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function syncStatus(msg,cls){
  var el=document.getElementById('sbSync');if(!el)return;
  if(msg){el.textContent=msg;el.className='dbsync'+(cls?' '+cls:'');return;}
  if(sbDirty()){el.textContent='⚠ 공유되지 않은 변경사항 — [팀 공유]를 누르면 다른 PC에서도 보여요';el.className='dbsync warn';}
  else if(sb.updatedAt){el.textContent='팀 데이터 동기화됨 · '+fmtStamp(sb.updatedAt);el.className='dbsync ok';}
  else{el.textContent='';el.className='dbsync';}
}
async function sbRemoteLoad(manual){
  try{
    var remote;
    if(SB_GAS_URL){
      var g=await fetch(SB_GAS_URL+'?t='+Date.now(),{redirect:'follow'});
      if(!g.ok)throw new Error('HTTP '+g.status);
      remote=await g.json();
      if(!remote||!remote.members){if(manual)toast('아직 공유된 팀 데이터가 없어요');syncStatus();return;}
    }else{
      var r=await fetch('https://api.github.com/repos/'+SB_REPO+'/contents/'+SB_DATA+'?ref='+SB_BRANCH,
        {cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}});
      if(!r.ok)throw new Error('HTTP '+r.status);
      remote=await r.json();
      if(!remote||!remote.members)throw new Error('데이터 형식 오류');
    }
    if((remote.updatedAt||'')>(sb.updatedAt||'')){
      if(sbDirty()&&!confirm('다른 PC에서 업데이트된 팀 데이터가 있어요.\n아직 공유하지 않은 내 변경사항을 버리고 팀 데이터를 불러올까요?')){syncStatus();return;}
      sb=remote;sbStore();setSbDirty(false);renderSbAll();
      syncStatus('팀 데이터 불러옴 · '+fmtStamp(remote.updatedAt),'ok');
      if(manual)toast('팀 데이터를 불러왔어요');
    }else{
      if(manual)toast('이미 최신 데이터예요');
      syncStatus();
    }
  }catch(e){
    if(manual){toast('팀 데이터를 불러오지 못했어요 ('+e.message+')');syncStatus('팀 데이터 불러오기 실패 — '+e.message,'err');}
    else syncStatus();
  }
}
async function sbRemotePush(){
  if(SB_GAS_URL)return sbGasPush();
  var tk=ghToken();
  if(!tk){openTokenModal();return;}
  syncStatus('팀 공유 중...','');
  try{
    var sha=null,remoteStamp='';
    var meta=await fetch('https://api.github.com/repos/'+SB_REPO+'/contents/'+SB_DATA+'?ref='+SB_BRANCH,
      {cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+tk}});
    if(meta.ok){
      var mj=await meta.json();sha=mj.sha;
      try{var cur=JSON.parse(decodeURIComponent(escape(atob(String(mj.content||'').replace(/\n/g,'')))));remoteStamp=cur.updatedAt||'';}catch(e2){}
    }else if(meta.status!==404)throw new Error('HTTP '+meta.status);
    if(remoteStamp&&remoteStamp>(sb.updatedAt||'')){
      if(!confirm('다른 PC에서 더 최신 데이터가 공유되어 있어요.\n내 데이터로 덮어쓸까요? (취소 후 [팀 데이터 불러오기]로 확인 가능)')){syncStatus();return;}
    }
    delete sb._seed;
    sb.updatedAt=new Date().toISOString();
    var body={message:'일정보드 데이터 업데이트 ('+tISO()+')',content:btoa(unescape(encodeURIComponent(JSON.stringify(sb,null,1)))),branch:SB_BRANCH};
    if(sha)body.sha=sha;
    var r=await fetch('https://api.github.com/repos/'+SB_REPO+'/contents/'+SB_DATA,
      {method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){
      if(r.status===401)throw new Error('토큰이 유효하지 않아요');
      if(r.status===403)throw new Error('토큰에 이 저장소 쓰기 권한이 없어요');
      if(r.status===409||r.status===422)throw new Error('충돌이 났어요 — [팀 데이터 불러오기] 후 다시 시도');
      throw new Error('HTTP '+r.status);
    }
    sbStore();setSbDirty(false);
    syncStatus('팀 공유됨 · '+fmtStamp(sb.updatedAt),'ok');
    toast('팀 저장소에 공유했어요');
  }catch(e){
    syncStatus('공유 실패 — '+e.message,'err');
    toast('공유 실패 — '+e.message);
  }
}
async function sbGasPush(){
  syncStatus('팀 공유 중...','');
  try{
    // 다른 PC에서 더 최신 데이터를 올렸는지 먼저 확인
    var remoteStamp='';
    try{
      var r0=await fetch(SB_GAS_URL+'?t='+Date.now(),{redirect:'follow'});
      if(r0.ok){var cur=await r0.json();remoteStamp=(cur&&cur.updatedAt)||'';}
    }catch(e0){}
    if(remoteStamp&&remoteStamp>(sb.updatedAt||'')){
      if(!confirm('다른 PC에서 더 최신 데이터가 공유되어 있어요.\n내 데이터로 덮어쓸까요? (취소 후 [팀 데이터 불러오기]로 확인 가능)')){syncStatus();return;}
    }
    delete sb._seed;
    sb.updatedAt=new Date().toISOString();
    var r=await fetch(SB_GAS_URL,{method:'POST',redirect:'follow',body:JSON.stringify(sb)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var res=await r.json();
    if(!res||!res.ok)throw new Error((res&&res.error)||'저장 실패');
    sbStore();setSbDirty(false);
    syncStatus('팀 공유됨 · '+fmtStamp(sb.updatedAt),'ok');
    toast('팀 시트에 공유했어요');
  }catch(e){
    syncStatus('공유 실패 — '+e.message,'err');
    toast('공유 실패 — '+e.message);
  }
}

/* ══════════════ 주간보고 연동 ══════════════
   IT부문 주간업무 보고 시트의 리뷰일·오픈일 후보를, 깃허브 액션이 주기적으로
   Apps Script에서 대신 읽어와 이 저장소의 wr-data.json 파일로 저장해둔다.
   (회사 네트워크가 구글 스크립트 응답 도메인을 막아두는 경우가 있어, 브라우저가
    직접 구글에 접속하지 않고 같은 깃허브 페이지에 있는 정적 파일만 읽도록 함.)
   실제 반영은 항상 사람이 확인 버튼을 눌러야만 일어난다 — 자동 매칭·자동 저장은 하지 않음. */
var WR_DATA_URL='wr-data.json';
var wrItems=[],wrLoaded=false;
function wrKey(it){return [it.team,it.week,it.date,it.kind,it.raw.slice(0,60)].join('|');}
function wrSeenMap(){sb.wrSeen=sb.wrSeen||{};return sb.wrSeen;}
/* "8월 3주차" 같은 주차 표기를 정렬용 숫자키로 변환(연도 없이 월/주차만, 클수록 최신) */
function wrWeekKey(w){
  var month=0,week=0;
  var mm=(w||'').match(/(\d{1,2})\s*월/);if(mm)month=+mm[1];
  var wm=(w||'').match(/(\d{1,2})\s*주차/);if(wm)week=+wm[1];
  return month*100+week;
}
function listWrPending(){
  var seen=wrSeenMap();
  return wrItems.filter(function(it){return !seen[wrKey(it)];})
    .sort(function(a,b){
      var wk=wrWeekKey(b.week)-wrWeekKey(a.week); // 최신 주차 먼저
      if(wk)return wk;
      return a.date<b.date?-1:1; // 같은 주차 안에서는 날짜순
    });
}
async function wrLoad(manual){
  try{
    var r=await fetch(WR_DATA_URL+'?t='+Date.now());
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();
    if(!j||!j.ok)throw new Error((j&&j.error)||'응답 오류');
    wrItems=j.items||[];wrLoaded=true;
    renderCards();
    if(manual)toast('주간보고를 확인했어요 · 신규 '+listWrPending().length+'건');
  }catch(e){
    if(manual)toast('주간보고를 불러오지 못했어요 ('+e.message+')');
  }
}
/* 제목 유사도로 기존 타임라인을 추천하기 위한 아주 가벼운 문자열 유사도 계산.
   형태소 분석 없이도 "(영어)","#12345" 같은 잡음을 지우고 글자 2개 단위(바이그램)로
   겹치는 정도를 보면 한국어 제목끼리도 그럭저럭 잘 맞는다. */
function normTitleForMatch(s){
  return (s||'')
    .replace(/\([^)]*\)/g,' ')
    .replace(/#\d+/g,' ')
    .replace(/[^0-9a-zA-Z가-힣]+/g,' ')
    .trim();
}
function bigrams(s){
  var out=[];
  for(var i=0;i<s.length-1;i++)out.push(s.substr(i,2));
  return out;
}
function titleSimilarity(a,b){
  var ba=bigrams(normTitleForMatch(a)),bb=bigrams(normTitleForMatch(b));
  if(!ba.length||!bb.length)return 0;
  var count={};
  ba.forEach(function(x){count[x]=(count[x]||0)+1;});
  var inter=0;
  bb.forEach(function(x){if(count[x]>0){count[x]--;inter++;}});
  return 2*inter/(ba.length+bb.length); // Sørensen–Dice 계수
}
function wrProjOptions(refTitle,autoPick){
  var live=sb.projects.filter(function(p){return !p.done;});
  var head='<option value="">반영할 타임라인 선택…</option><option value="__new__">➕ 새 타임라인으로 추가</option>';
  if(!live.length)return head;
  var SIM_THRESH=0.28; // 이 이상이면 "제목이 꽤 비슷하다"고 보고 ⭐ 추천 표시
  var scored=live.map(function(p){return {p:p,score:titleSimilarity(refTitle||'',p.title)};});
  scored.sort(function(a,b){return b.score-a.score;});
  var bestId=(autoPick&&scored.length&&scored[0].score>=SIM_THRESH)?scored[0].p.id:null;
  return head+scored.map(function(o){
    var star=o.score>=SIM_THRESH?'⭐ ':'';
    var sel=(bestId===o.p.id)?' selected':'';
    return '<option value="'+o.p.id+'"'+sel+'>'+star+esc(o.p.title)+'</option>';
  }).join('');
}
function wrKindLabel(it){
  // "기획" 항목은 걸러진 뒤엔 항상 status가 "예정"이라, "기획 · 예정"보다
  // "기획완료 예정"이라고 한 문장처럼 붙여 써야 무슨 뜻인지 바로 읽힌다.
  if(it.kind==='기획'&&it.status==='예정')return '기획완료 예정';
  return it.kind+(it.status?' · '+it.status:'');
}
/* "기획팀 일정" 마스터 시트에서 온 항목인지 — planItem()이 week에 이 접두어를 붙여서 표시해둔다 */
function isPlanSheetItem(it){return /^기획팀 일정시트/.test(it.week||'');}
function wrRowHtml(it){
  var key=wrKey(it);
  var kindCls=it.kind==='오픈'?'open':((it.kind==='리뷰'||it.kind==='검수')?'inspect':'');
  var planSrc=isPlanSheetItem(it);
  var canApply=!planSrc&&(it.kind==='오픈'||it.kind==='리뷰'||it.kind==='검수');
  var noApplyMsg=planSrc?'기획팀 일정시트 항목은 확인용으로만 보여드려요. 웹디자인팀 타임라인이 기획팀 업무로 채워지지 않도록 타임라인에는 반영하지 않아요.':'기획 완료(예정)일은 타임라인의 특정 필드에 반영할 곳이 없어 정보 확인용으로만 보여드려요';
  var applyCtl=canApply

var KW_LABEL={figma:'피그마 신기능',adobe:'어도비 신기능',ai:'🤖 AI 뉴스',industry:'업계동향',design:'디자인',trend:'트렌드',frontend:'프론트엔드'};
var KW_COLOR={figma:'#3a7d44',adobe:'#b84c1a',ai:'#c2185b',industry:'#7b3fa0',design:'#1a5fa0',trend:'#a06020',frontend:'#1a7a7a'};
var kwCards=[], kwCurFilter='all';
var LS_KW='wd_kw_articles'; // 누적 기사 저장 키

// 로컬스토리지에서 누적 기사 불러오기
function kwLsLoad(){
  try{
    var s=localStorage.getItem(LS_KW);
    if(s) kwCards=JSON.parse(s);
  }catch(e){}
}

// 새 기사를 기존 누적 데이터에 병합 (title 기준 중복 제거, 최신 유지)
function kwMerge(newArticles){
  var map={};
  // 기존 데이터 먼저 맵에 등록
  kwCards.forEach(function(a){ map[a.title]=a; });
  // 새 데이터로 덮어쓰기 (최신 내용 우선)
  newArticles.forEach(function(a){ map[a.title]=a; });
  // collectedAt 기준 최신순 정렬
  kwCards=Object.values(map).sort(function(a,b){
    var da=a.publishedAt||a.collectedAt||a.date||'';
    var db=b.publishedAt||b.collectedAt||b.date||'';
    return db.localeCompare(da);
  });
  try{ localStorage.setItem(LS_KW, JSON.stringify(kwCards)); }catch(e){}
}

// 누적 기사 초기화
function kwClearStorage(){
  if(!confirm('저장된 모든 지식지갑 기사를 초기화할까요?\n삭제 후 새로고침 시 최신 데이터만 표시돼요.')) return;
  localStorage.removeItem(LS_KW);
  kwCards=[];
  kwLoad();
  toast('지식지갑 기사를 초기화했어요');
}

async function kwLoad(){
  // 기존 누적 데이터 먼저 표시 (빠른 렌더링)
  kwLsLoad();
  if(kwCards.length>0){
    kwRender();
    document.getElementById('kwupd').textContent='불러오는 중...';
  } else {
    document.getElementById('kwgrid').innerHTML='<div class="kwloading"><div class="dots"><span></span><span></span><span></span></div><p style="margin-top:14px">뉴스를 불러오는 중이에요</p></div>';
  }

  // 새 데이터 fetch 후 누적 병합 (실시간 피드 우선, 실패 시 저장소 스냅샷을 오프라인 폴백으로 사용)
  var sources=[
    'https://soullim.github.io/knowledge-wallet/news.json?t='+Date.now(),
    'news.json?t='+Date.now()
  ];
  var fetched=false;
  for(var i=0;i<sources.length;i++){
    try{
      var res=await fetch(sources[i]);
      if(!res.ok) continue;
      var data=await res.json();
      var articles=data.articles||[];
      if(articles.length>0){
        kwMerge(articles); // 누적 병합
        var now=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
        document.getElementById('kwupd').textContent='마지막 업데이트: '+now+' · 총 '+kwCards.length+'개';
        fetched=true; break;
      }
    }catch(e){ continue; }
  }

  if(!fetched){
    // fetch 실패 시 누적 데이터 그대로 유지, 없으면 샘플
    if(kwCards.length===0){
      kwCards=kwSample();
      document.getElementById('kwupd').textContent='샘플 데이터 (연결 실패)';
    } else {
      document.getElementById('kwupd').textContent='오프라인 · 누적 '+kwCards.length+'개';
    }
  }
  kwRender();
}

function kwRender(){
  var filtered=kwCurFilter==='all'?kwCards:kwCards.filter(function(c){ return c.category===kwCurFilter; });
  var list=[].concat(filtered).sort(function(a,b){
    var da=a.publishedAt||a.collectedAt||'', db=b.publishedAt||b.collectedAt||'';
    return db.localeCompare(da);
  });
  document.getElementById('kwcnt').textContent=list.length+'개';
  if(!list.length){ document.getElementById('kwgrid').innerHTML='<div class="kwloading" style="color:var(--text3)">해당 분야의 뉴스가 없어요</div>'; return; }
  document.getElementById('kwgrid').innerHTML=list.map(function(card,i){
    var idx=kwCards.indexOf(card);
    return '<article class="kwcard kwcard-'+card.category+'" style="animation-delay:'+(i*.04)+'s" onclick="kwOpen('+idx+')">'+
      '<div class="kwbar"></div>'+
      '<div class="kwbody">'+
        '<div class="kwtop2">'+
          '<span class="kwchip chip-'+card.category+'">'+(KW_LABEL[card.category]||card.category)+'</span>'+
          '<span class="kwdate">'+(card.date||'')+'</span>'+
        '</div>'+
        '<p class="kwtitle">'+esc(card.title)+'</p>'+
        '<p class="kwsummary">'+esc(card.summary)+'</p>'+
        '<div class="kwkws">'+(card.keywords||[]).map(function(k){ return '<span class="kwtag"># '+esc(k)+'</span>'; }).join('')+'</div>'+
        '<div class="kwfoot"><span class="kwsrc">'+esc(card.source)+'</span><span class="kwmore">자세히 보기 →</span></div>'+
      '</div>'+
    '</article>';
  }).join('');
}

function kwSetFilter(cat,btn){
  kwCurFilter=cat;
  document.querySelectorAll('.kwfbtn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  kwRender();
}

function kwOpen(idx){
  var c=kwCards[idx]; if(!c) return;
  var col=KW_COLOR[c.category]||'#888';
  document.getElementById('kwacc').style.background=col;
  document.getElementById('kwmsrcdot').style.background=col;
  document.getElementById('kwmchip').textContent=KW_LABEL[c.category]||c.category;
  document.getElementById('kwmchip').className='kwchip chip-'+c.category;
  document.getElementById('kwmdate').textContent=c.date||'';
  document.getElementById('kwmtitle').textContent=c.title||'';
  document.getElementById('kwmsrc').textContent=c.source||'';
  document.getElementById('kwmlink').href=c.url||'#';
  document.getElementById('kwmsum').textContent=c.summary||'';
  var full=c.summary_full||c.summary||'';
  var sents=full.split(/(?<=[.!?])\s+/).filter(function(s){ return s.trim().length>5; });
  document.getElementById('kwmpts').innerHTML=sents.map(function(s){
    return '<li><span class="kwmpt-dot" style="background:'+col+';opacity:.5"></span><span>'+esc(s.trim())+'</span></li>';
  }).join('')||('<li><span class="kwmpt-dot" style="background:'+col+';opacity:.5"></span><span>'+esc(full)+'</span></li>');
  document.getElementById('kwmkws').innerHTML=(c.keywords||[]).map(function(k){ return '<span class="kwmkw"># '+esc(k)+'</span>'; }).join('');
  window._kwUrl=c.url||location.href;
  document.getElementById('kwmovl').classList.add('on');
  document.body.style.overflow='hidden';
}
var kwDownOnOvl=false;
function kwMClose(e){ if(e.target===document.getElementById('kwmovl')&&kwDownOnOvl) kwMDismiss(); }
function kwMDismiss(){ document.getElementById('kwmovl').classList.remove('on'); document.body.style.overflow=''; }
function kwCopy(){
  navigator.clipboard.writeText(window._kwUrl||location.href).then(function(){
    var btn=document.querySelector('.kwmshare');
    var orig=btn.textContent; btn.textContent='✅ 복사됐어요!';
    setTimeout(function(){ btn.textContent=orig; },2000);
  });
}
