<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹디자인팀 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600}
@font-face{font-family:'Paperlogy';src:url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Pretendard','Noto Sans KR',sans-serif;
  --ftitle:'Paperlogy','Pretendard',sans-serif;
  --accent:#6366F1;--accent-soft:#EEF2FF;
  --teal:#0F9B8E;
  --amber:#F59E0B;--amber-soft:#FFFBEB;
  --red:#EF4444;--red-soft:#FEF2F2;
  --green:#10B981;--green-soft:#ECFDF5;
  --blue:#3B82F6;--blue-soft:#EFF6FF;
  --border:#E2E8F0;--border2:#CBD5E1;
  --bg:#F8FAFC;--bg2:#F1F5F9;
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --white:#fff;
  --col-figma:#3a7d44;--col-adobe:#b84c1a;--col-industry:#7b3fa0;
  --col-design:#1a5fa0;--col-trend:#a06020;--col-frontend:#1a7a7a;--col-ai:#c2185b;
  --bg-figma:rgba(58,125,68,.09);--bg-adobe:rgba(184,76,26,.09);
  --bg-industry:rgba(123,63,160,.09);--bg-design:rgba(26,95,160,.09);
  --bg-trend:rgba(160,96,32,.09);--bg-frontend:rgba(26,122,122,.09);--bg-ai:rgba(194,24,91,.09);
}
html,body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);line-height:1.6}

/* NAV */
.gnav{background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:200;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.glogo{font-family:var(--ftitle);font-size:17px;font-weight:800;color:var(--accent);margin-right:2rem;white-space:nowrap;text-decoration:none}
.glogo span{color:var(--text)}
.gtabs{display:flex;height:100%}
.gtab{display:flex;align-items:center;gap:7px;padding:0 20px;font-size:15px;font-weight:600;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;font-family:var(--font);transition:color .15s}
.gtab:hover{color:var(--text)}
.gtab.on{color:var(--accent);border-bottom-color:var(--accent)}
.gright{margin-left:auto;display:flex;align-items:center;gap:10px}
.gdate{font-size:14px;color:var(--text3)}

/* PAGE */
.page{display:none}
.page.on{display:block}

/* BTN */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--white);color:var(--text);font-size:14px;cursor:pointer;font-family:var(--font);font-weight:600;transition:background .12s}
.btn:hover{background:var(--bg2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#4F46E5}
.btn.sm{font-size:13px;padding:5px 11px}
.btn.del{color:var(--red);border-color:#FECACA}
.btn.del:hover{background:var(--red-soft)}
.btn.tl{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.tl:hover{background:#0C8278}
.btn.ghost{background:none;border-color:transparent;color:var(--text3);padding:7px 8px;font-weight:500}
.btn.ghost:hover{background:var(--bg2)}

/* 일정보드 */
#pg-db{padding:1.5rem;max-width:1100px;margin:0 auto}
.dbtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:12px}
.dbtitle{font-family:var(--ftitle);font-size:22px;font-weight:800}
.dbsub{font-size:14px;color:var(--text3);margin-top:3px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:1.1rem 1.25rem;margin-bottom:1rem}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:10px}
.sectitle{font-family:var(--ftitle);font-size:15px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px}
.sectitle .ssub{font-family:var(--font);font-size:12.5px;color:var(--text3);font-weight:500;margin-left:8px}
.mini{font-size:12.5px;color:var(--text2);display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:400}
.mini input{accent-color:var(--text)}

/* 담당자 범례 */
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.lg-hint{font-size:12px;color:var(--text3);margin-left:2px}
.mpill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px 5px 9px;border-radius:20px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;border:none;line-height:1.3;transition:filter .15s,opacity .15s;font-family:var(--font)}
.mpill .mp-emoji{font-size:15px}
.mpill .mp-role{display:block;font-size:9px;font-weight:500;opacity:.85;letter-spacing:.3px}
.mpill.off{filter:grayscale(1);opacity:.45}
.mpill .mp-tag{font-size:9.5px;font-weight:600;border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:0 6px;margin-left:2px}

/* 요약 카드 */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.25rem}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;font-family:var(--font);transition:border-color .15s}
.kpi.sel{border-color:var(--accent)}
.kpi-lbl{font-size:14px;color:var(--text3);margin-bottom:4px}
.kpi-val{font-family:var(--ftitle);font-size:28px;font-weight:800;color:var(--text)}
.kpi-val.ok{color:var(--green)}.kpi-val.warn{color:var(--amber)}.kpi-val.danger{color:var(--red)}

.panel{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:1rem}
.panel .pn-row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;font-size:14px}
.panel .pn-row:last-child{border-bottom:none}
.panel .pn-empty{padding:18px 16px;color:var(--text3);font-size:14px}
.pn-title{font-weight:600;flex:1;min-width:160px}
.pn-sub{color:var(--text3);font-size:13px}
.dchip{font-size:12px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--amber-soft);color:var(--amber)}
.dchip.late{background:var(--red-soft);color:var(--red)}
.dchip.open{background:var(--accent-soft);color:var(--accent)}
.kchip{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--bg2);color:var(--text3)}

/* 타임라인 카드 */
.tl-card{background:var(--bg2);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.tl-card.is-done{opacity:.6}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tl-head input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer}
.tl-title{font-family:var(--ftitle);font-weight:700;font-size:14.5px}
.tl-card.is-done .tl-title{text-decoration:line-through;color:var(--text3)}
.chip{font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px}
.chip.biz{background:var(--accent-soft);color:var(--accent)}
.chip.reopen{background:var(--red-soft);color:var(--red)}
.chip.solo{background:var(--bg2);border:1px solid var(--border2);color:var(--text3);font-weight:500}
.tl-acts{margin-left:auto;display:flex;gap:2px}
.icbtn{font-size:12px;color:var(--text3);padding:4px 8px;border-radius:7px;border:none;background:none;font-family:var(--font);cursor:pointer}
.icbtn:hover{background:var(--white);color:var(--text)}
.bar{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12px;font-weight:600}
.seg{display:flex;align-items:center;justify-content:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg a{color:inherit;text-decoration:underline dotted}
.ph-design{background:#9FE1CB;color:#085041}
.ph-pub{background:#B5D4F4;color:#0C447C}
.ph-plan{background:var(--accent-soft);color:var(--accent)}
.ph-dev{background:#D3D1C7;color:#444}
.ph-qa{background:#FAC775;color:#633806}
.ph-stub{background:var(--bg2);color:var(--text3);border-left:2px solid var(--amber)}
.tl-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--text3)}
.ho-line{color:var(--amber);font-weight:600}
.ho-line.late{color:var(--red)}
.issue-list{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.issue-row{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--text2);padding:2px 0}
.issue-row input{accent-color:var(--green);margin-top:3px}
.issue-row.done span{text-decoration:line-through;color:var(--text3)}

/* 담당자 워크로드 달력 */
.cal-wrap{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.calnav{display:flex;align-items:center;gap:4px}
.calnav .nbtn{font-size:16px;padding:4px 10px;border-radius:8px;color:var(--text3);border:none;background:none;font-family:var(--font);cursor:pointer}
.calnav .nbtn:hover{background:var(--bg2)}
.calnav span{font-family:var(--ftitle);font-weight:700;font-size:14.5px;min-width:96px;text-align:center;display:inline-block}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg2);font-size:12px;color:var(--text3);text-align:center;padding:7px 0;border-bottom:1px solid var(--border)}
.cal-dow .wkend{opacity:.6}
.week{border-bottom:1px solid var(--border)}
.week:last-child{border-bottom:none}
.days{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--text3)}
.days span{padding:6px 8px 3px}
.days .out{opacity:.35}
.days .wkend{opacity:.6}
.days .today{font-weight:800;color:#fff;position:relative}
.days .today::before{content:'';position:absolute;left:5px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);z-index:0}
.days .today::after{content:attr(data-d);position:absolute;left:5px;top:4px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;z-index:1}
.lanes{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:21px;gap:3px 3px;padding:1px 4px 9px;min-height:10px}
.bar-ev{border-radius:6px;color:#fff;font-size:11px;font-weight:700;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left;line-height:1.8;border:none;font-family:var(--font)}
.bar-ev.is-done{opacity:.4;text-decoration:line-through}
.cal-empty{padding:26px;text-align:center;color:var(--text3);font-size:14px}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;align-items:center;justify-content:center;padding:20px}
.moverlay.on{display:flex}
.mbox{background:var(--white);border-radius:16px;padding:1.75rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.14)}
.mbox.wide{max-width:640px}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.mtitle{font-family:var(--ftitle);font-size:18px;font-weight:800}
.m-sub{font-size:13px;color:var(--text3);margin-bottom:14px}
.fl{margin-bottom:12px}
.fl label{font-size:14px;color:var(--text2);margin-bottom:5px;display:block;font-weight:600}
.fi{width:100%;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--border2);background:var(--white);color:var(--text);font-family:var(--font)}
.fi:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;color:var(--text3);margin-bottom:3px;font-weight:600}
.fld input,.fld select{width:100%}
.phrow{display:grid;grid-template-columns:86px 1fr 1fr 96px 28px;gap:6px;margin-top:6px;align-items:center}
.phrow input{padding:6px 8px;font-size:12.5px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text);font-family:var(--font)}
.ph-head{font-size:12px;color:var(--text3);font-weight:600;margin-top:12px}
.fsec{font-size:13px;font-weight:700;color:var(--text2);margin:16px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.factions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)}
.note{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 11px;margin-top:10px}
.dl-row{display:flex;gap:10px;font-size:14px;padding:5px 0;align-items:baseline}
.dl-row b{min-width:64px;font-size:12px;color:var(--text3);font-weight:600}
.empty{text-align:center;padding:2rem;font-size:14px;color:var(--text3)}
.loadrow{text-align:center;padding:1.5rem;font-size:14px;color:var(--text3)}

/* TOAST */
.toast{position:fixed;bottom:28px;right:28px;background:var(--text);color:#fff;font-size:14px;padding:11px 18px;border-radius:10px;z-index:999;opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}

/* KNOWLEDGE */
#pg-kw{background:var(--bg)}
.kwtop{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem}
.kwtopin{max-width:1100px;margin:0 auto;height:50px;display:flex;align-items:center;justify-content:space-between}
.kwupd{font-size:14px;color:var(--text3)}
.kwrefresh{font-size:14px;padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-family:var(--font);transition:all .2s}
.kwrefresh:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.kwfbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 1.5rem}
.kwfin{max-width:1100px;margin:0 auto;display:flex;gap:7px;padding:11px 0;overflow-x:auto;scrollbar-width:none}
.kwfin::-webkit-scrollbar{display:none}
.kwfbtn{white-space:nowrap;padding:6px 17px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:14px;font-family:var(--font);cursor:pointer;transition:all .18s;flex-shrink:0}
.kwfbtn:hover{border-color:var(--border2);color:var(--text);background:var(--bg2)}
.kwfbtn.on{font-weight:600;border-color:transparent}
.kwfbtn[data-c="all"].on{background:var(--text);color:#fff}
.kwfbtn[data-c="figma"].on{background:var(--col-figma);color:#fff}
.kwfbtn[data-c="adobe"].on{background:var(--col-adobe);color:#fff}
.kwfbtn[data-c="industry"].on{background:var(--col-industry);color:#fff}
.kwfbtn[data-c="design"].on{background:var(--col-design);color:#fff}
.kwfbtn[data-c="trend"].on{background:var(--col-trend);color:#fff}
.kwfbtn[data-c="frontend"].on{background:var(--col-frontend);color:#fff}
.kwfbtn[data-c="ai"].on{background:var(--col-ai);color:#fff}
.kwmain{max-width:1100px;margin:0 auto;padding:26px 1.5rem}
.kwmeta{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.kwmetatitle{font-family:var(--ftitle);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3)}
.kwmetacnt{font-size:13px;color:var(--text3)}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.kwcard{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column;animation:fadeup .35s ease both}
.kwcard:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.07);border-color:var(--border2)}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.kwbar{height:3px}
.kwbody{padding:17px 19px;flex:1;display:flex;flex-direction:column;gap:10px}
.kwtop2{display:flex;justify-content:space-between;align-items:center}
.kwchip{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px}
.kwdate{font-size:13px;color:var(--text3)}
.kwtitle{font-family:var(--ftitle);font-size:16px;font-weight:700;line-height:1.5;color:var(--text);word-break:keep-all}
.kwsummary{font-size:14px;color:var(--text2);line-height:1.7;word-break:keep-all;flex:1}
.kwkws{display:flex;flex-wrap:wrap;gap:5px}
.kwtag{font-size:13px;padding:3px 9px;border-radius:4px;background:var(--bg2);color:var(--text3);border:1px solid var(--border)}
.kwfoot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:auto}
.kwsrc{font-size:13px;color:var(--text3)}
.kwmore{font-size:13px;font-weight:600;color:var(--accent)}
.kwcard-figma .kwbar{background:var(--col-figma)}
.kwcard-adobe .kwbar{background:var(--col-adobe)}
.kwcard-industry .kwbar{background:var(--col-industry)}
.kwcard-design .kwbar{background:var(--col-design)}
.kwcard-trend .kwbar{background:var(--col-trend)}
.kwcard-frontend .kwbar{background:var(--col-frontend)}
.kwcard-ai .kwbar{background:var(--col-ai)}
.chip-figma{background:var(--bg-figma);color:var(--col-figma)}
.chip-adobe{background:var(--bg-adobe);color:var(--col-adobe)}
.chip-industry{background:var(--bg-industry);color:var(--col-industry)}
.chip-design{background:var(--bg-design);color:var(--col-design)}
.chip-trend{background:var(--bg-trend);color:var(--col-trend)}
.chip-frontend{background:var(--bg-frontend);color:var(--col-frontend)}
.chip-ai{background:var(--bg-ai);color:var(--col-ai)}
.kwloading{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3);font-size:14px}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 3px;animation:dot 1.2s infinite;opacity:.3}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-7px);opacity:1}}

/* KW MODAL */
.kwmovl{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:500;align-items:center;justify-content:center;padding:20px}
.kwmovl.on{display:flex}
.kwmpanel{background:var(--white);border:1px solid var(--border);border-radius:16px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.14);animation:mIn .25s cubic-bezier(.34,1.56,.64,1)}
@keyframes mIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.kwmacc{height:4px;border-radius:16px 16px 0 0}
.kwmin{padding:26px 28px 28px}
.kwmhd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.kwmmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kwmclose{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2);transition:background .15s}
.kwmclose:hover{background:var(--border);color:var(--text)}
.kwmdate{font-size:14px;color:var(--text3)}
.kwmtitle{font-family:var(--ftitle);font-size:20px;font-weight:800;line-height:1.45;color:var(--text);word-break:keep-all;margin:0 0 7px}
.kwmsrcrow{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.kwmsrcdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.kwmsrctxt{font-size:14px;color:var(--text3)}
.kwmdiv{border:none;border-top:1px solid var(--border);margin:18px 0}
.kwmlbl{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin:0 0 9px}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ══════════════ 일정보드 유틸 ══════════════ */
var $=function(s){return document.querySelector(s);};
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function sbToday(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function addD(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function sbDiff(a,b){return Math.round((fromISO(b)-fromISO(a))/86400000);}
function fmtMD(s){if(!s)return'';var d=fromISO(s);return (d.getMonth()+1)+'/'+d.getDate();}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

var RM_BASE='http://10.30.100.24/issues/';
var BIZ=['T클래스','해법수학교실','닥터매쓰','스마트러닝','독서논술','FC 영어','FC 수학','마케팅','기타'];
var BIZKEY={'T클래스':['t클래스','티클래스'],'해법수학교실':['수학교실'],'닥터매쓰':['닥터매쓰'],'스마트러닝':['스마트러닝','공동구매'],'독서논술':['독서논술','해법독서','논술','세계사'],'FC 영어':['fc영어','fc 영어'],'FC 수학':['fc수학','fc 수학'],'마케팅':['마케팅','카드뉴스']};
function guessBiz(t){var s=String(t).toLowerCase();for(var b in BIZKEY){for(var i=0;i<BIZKEY[b].length;i++){if(s.indexOf(BIZKEY[b][i])>=0)return b;}}return '기타';}

/* ══════════════ 상태 / 저장 ══════════════ */
var SB_LS='wdsb_data_v1', SB_FLAG='wdsb_init_v1';
var DEFAULT_MEMBERS=[
 {name:'김수영',nick:'soo',emoji:'🙈',role:'Designer',c1:'#FFB02E',c2:'#FF7A00',active:true,visible:true},
 {name:'김미리',nick:'havefunlife',emoji:'🧸',role:'Designer',c1:'#35E0A1',c2:'#00BFCB',active:true,visible:true},
 {name:'문효진',nick:'vava',emoji:'🐭',role:'Designer',c1:'#E07BF7',c2:'#B23BE0',active:true,visible:true},
 {name:'유서원',nick:'lina',emoji:'🦁',role:'Designer',c1:'#B5E03A',c2:'#2FBF55',active:false,visible:false},
 {name:'양동준',nick:'dongjun',emoji:'🐨',role:'Publisher',c1:'#56A4FF',c2:'#8B5CF6',active:true,visible:true}
];
var sb=loadSbState();

  try{var raw=localStorage.getItem(SB_LS);if(raw){var s=JSON.parse(raw);if(s&&s.members)return s;}}catch(e){}
  if(localStorage.getItem(SB_FLAG)){return sbBlank();}

  return sbSeed();
}
function sbBlank(){return {members:JSON.parse(JSON.stringify(DEFAULT_MEMBERS)),projects:[],tasks:[],ui:{solo:true}};}
function sbSave(){localStorage.setItem(SB_LS,JSON.stringify(sb));}
function sbSeed(){

      {name:'Dev',start:'2026-07-10',end:'2026-07-16',owner:'오정희'},
      {name:'Stg',start:'2026-07-20',end:'2026-07-20',owner:'오정희'}
    ]});
  s.tasks.push({id:uid('t'),rm:'20454',url:RM_BASE+'20454',title:'세계사 신규 학습생 이벤트 띠배너',tag:'퍼블',owner:'양동준',start:'2026-05-26',end:'2026-05-29',biz:'독서논술',status:'진행',prio:'보통',done:true,reopen:false,issues:[],chain:null});
  s.tasks.push({id:'t_d1',rm:'20431',url:RM_BASE+'20431',title:'FC수학 여름특강 상세페이지',tag:'디자인',owner:'김미리',start:'2026-06-08',end:'2026-06-12',biz:'FC 수학',status:'진행',prio:'보통',done:false,reopen:false,issues:[],chain:'c_fc1'});
  s.tasks.push({id:'t_p1',rm:'20458',url:RM_BASE+'20458',title:'FC수학 여름특강 상세페이지',tag:'퍼블',owner:'양동준',start:'2026-06-15',end:'2026-06-18',biz:'FC 수학',status:'대기',prio:'보통',done:false,reopen:false,issues:[],chain:'c_fc1'});
  s.tasks.push({id:uid('t'),rm:'20452',url:RM_BASE+'20452',title:'독서논술 LMS 메인 배너',tag:'디자인',owner:'문효진',start:'2026-06-10',end:'2026-06-18',biz:'독서논술',status:'진행',prio:'보통',done:false,reopen:false,issues:[],chain:null});
  s.tasks.push({id:uid('t'),rm:'20460',url:RM_BASE+'20460',title:'마케팅 카드뉴스 6월호',tag:'디자인',owner:'김수영',start:'2026-06-15',end:'2026-06-19',biz:'마케팅',status:'대기',prio:'보통',done:false,reopen:false,issues:[],chain:null});
  s.tasks.push({id:uid('t'),rm:'20449',url:RM_BASE+'20449',title:'T클래스 학습리포트 개편',tag:'퍼블',owner:'양동준',start:'2026-06-09',end:'2026-06-16',biz:'T클래스',status:'진행',prio:'높음',done:false,reopen:true,issues:[{id:uid('i'),text:'메인 배너 카피 변경 요청',date:'2026-06-10',done:false}],chain:null});

function sbMember(name){if(!name)return null;var n=String(name).trim();for(var i=0;i<sb.members.length;i++){var m=sb.members[i];if(m.name===n||m.nick===n||n.indexOf(m.name)>=0)return m;}return null;}
function ownerDisp(name){var m=sbMember(name);return m?m.nick:esc(name);}

/* ══════════════ 파서 ══════════════ */
function normName(s){
  var n=String(s).replace(/(팀장님|팀장|책임님|선임님|님|씨)\s*$/,'').trim();
  var p=n.split(/\s+/);
  if(p.length===2&&/^[가-힣]+$/.test(p[0])&&/^[가-힣]{1,2}$/.test(p[1]))n=p[1]+p[0];
  return n;
}
function canonPhase(n){var u=n.trim().toLowerCase();if(u==='dev')return 'Dev';if(u==='stg')return 'Stg';if(u==='qa')return 'QA';return n.trim();}
function inferDate(m,d){
  var ty=sbToday().getFullYear(),cands=[ty,ty+1,ty-1];
  for(var i=0;i<cands.length;i++){
    var di=cands[i]+'-'+pad(m)+'-'+pad(d);
    var df=sbDiff(iso(sbToday()),di);
    if(df>=-180&&df<=430)return di;
  }
  return ty+'-'+pad(m)+'-'+pad(d);
}
function parseMail(txt){
  var lines=txt.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var res={title:'',biz:'',open:'',phases:[],owners:{}};
  var phRe=/^[-*·•]?\s*(디자인|퍼블|기획|개발|Dev|Stg|QA)\s*[:：]\s*(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*[~\-–∼]\s*(?:(\d{1,2})\s*\/\s*)?(\d{1,2}))?/i;
  var openRe=/^[-*·•]?\s*(Open|오픈)\s*[:：]\s*(\d{1,2})\s*\/\s*(\d{1,2})/i;
  var ownRe=/^[-*·•]?\s*(디자인|퍼블|개발)\s*[:：]\s*([가-힣A-Za-z\s]+?)\s*$/;
  for(var i=0;i<lines.length;i++){
    var l=lines[i],m;
    m=l.match(openRe);
    if(m){res.open=inferDate(+m[2],+m[3]);continue;}
    m=l.match(phRe);
    if(m){
      var st=inferDate(+m[2],+m[3]),en=st;
      if(m[5]){var em=m[4]?+m[4]:+m[2];en=inferDate(em,+m[5]);if(sbDiff(st,en)<0)en=st;}
      res.phases.push({name:canonPhase(m[1]),start:st,end:en,owner:''});continue;
    }
    if(!/\d\s*\//.test(l)){
      m=l.match(ownRe);
      if(m){res.owners[canonPhase(m[1])]=normName(m[2]);continue;}
    }
    if(!res.title&&!/^[-=ـ_]+$/.test(l)&&l.indexOf('일정 안내')<0){
      res.title=l.replace(/\s*건\s*일정.*$/,'').replace(/\s*일정\s*산정.*$/,'').replace(/\s*공유\s*드립니다.*$/,'').trim();
    }
  }
  res.phases.forEach(function(p){
    if(res.owners[p.name])p.owner=res.owners[p.name];
    else if((p.name==='Dev'||p.name==='Stg'||p.name==='QA')&&res.owners['개발'])p.owner=res.owners['개발'];
  });
  res.biz=guessBiz(res.title+' '+txt);
  return res;
}
function parseRedmine(txt){
  var r={rm:'',url:'',title:'',tag:'기타',owner:'',start:'',end:'',status:'',prio:'',biz:''};
  var m=txt.match(/\[(.+)\]\((https?:\/\/[^\s)]+)\)/);
  if(m){
    r.url=m[2].split('#')[0];
    var t=m[1].match(/#(\d+)\s*[:：]?\s*(.*)$/);
    if(t){r.rm=t[1];r.title=t[2].trim();}else{r.title=m[1];}
  }else{
    var n=txt.match(/#(\d+)/);if(n)r.rm=n[1];
    var first=txt.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean)[0]||'';
    r.title=first.replace(/^\[?(신규|진행|수정)?\s*#\d+\s*[:：]?\s*/,'').replace(/\]?\s*(진행중|진행|신규|완료)?\s*$/,'').trim();
  }
  var tg=r.title.match(/\[(디자인|퍼블|기획|개발)\]/);
  if(tg)r.tag=tg[1];
  r.title=r.title.replace(/\[[^\]]*\]/g,'').trim();
  m=txt.match(/담당자\s*[:：]\s*(.+)/);if(m)r.owner=normName(m[1].split(/\r?\n/)[0]);
  m=txt.match(/시작시간\s*[:：]\s*(\d{4}-\d{2}-\d{2})/);if(m)r.start=m[1];
  m=txt.match(/완료기한\s*[:：]\s*(\d{4}-\d{2}-\d{2})/);if(m)r.end=m[1];
  m=txt.match(/상태\s*[:：]\s*(\S+)/);if(m)r.status=m[1];
  m=txt.match(/우선순위\s*[:：]\s*(\S+)/);if(m)r.prio=m[1];
  if(!r.url&&r.rm)r.url=RM_BASE+r.rm;
  if(!r.end&&r.start)r.end=r.start;
  if(!r.start&&r.end)r.start=r.end;
  r.biz=guessBiz(r.title+' '+txt);
  return r;
}
function normT(t){return String(t).replace(/\[[^\]]*\]/g,'').replace(/[\s·\-–_]/g,'').toLowerCase();}
function chainCandidates(title,excludeId){
  var n=normT(title);if(n.length<4)return [];
  return sb.tasks.filter(function(t){
    if(t.id===excludeId)return false;
    var o=normT(t.title);
    return o.length>=4&&(o.indexOf(n)>=0||n.indexOf(o)>=0);
  });
}

/* ══════════════ 요약 계산 ══════════════ */
function tISO(){return iso(sbToday());}
function weekRange(){var t=sbToday();var mon=addD(t,-((t.getDay()+6)%7));return [iso(mon),iso(addD(mon,6))];}
function chainGroups(){
  var g={};
  sb.tasks.forEach(function(t){if(t.chain){(g[t.chain]=g[t.chain]||[]).push(t);}});
  for(var k in g)g[k].sort(function(a,b){return a.start<b.start?-1:1;});
  return g;
}
function allHandoffs(){
  var hs=[];
  sb.projects.forEach(function(p){
    if(p.done)return;
    for(var i=0;i<p.phases.length-1;i++){
      var a=p.phases[i],b=p.phases[i+1];
      hs.push({date:a.end,label:a.name+'→'+b.name+' 전달',owner:a.owner,title:p.title,url:null,ref:{type:'project',id:p.id}});
    }
  });
  var g=chainGroups();
  for(var k in g){
    var arr=g[k].filter(function(t){return !t.done;});
    var full=g[k];
    for(var i=0;i<full.length-1;i++){
      if(full[i].done)continue;
      hs.push({date:full[i].end,label:full[i].tag+'→'+full[i+1].tag+' 전달',owner:full[i].owner,title:full[i].title,url:full[i].url,rm:full[i].rm,ref:{type:'task',id:full[i].id}});
    }
    var last=full[full.length-1];
    if(last&&!last.done&&last.tag==='퍼블')hs.push({date:last.end,label:'퍼블→개발 전달',owner:last.owner,title:last.title,url:last.url,rm:last.rm,ref:{type:'task',id:last.id}});
  }
  sb.tasks.forEach(function(t){
    if(t.chain||t.done||t.tag!=='퍼블')return;
    hs.push({date:t.end,label:'퍼블→개발 전달',owner:t.owner,title:t.title,url:t.url,rm:t.rm,ref:{type:'task',id:t.id}});
  });
  hs.sort(function(a,b){return a.date<b.date?-1:1;});
  return hs;
}
function listOpens(){
  var wr=weekRange();
  return sb.projects.filter(function(p){return !p.done&&p.open&&p.open>=wr[0]&&p.open<=wr[1];});
}
function listHandoffsImminent(){
  var t=tISO();
  return allHandoffs().filter(function(h){var d=sbDiff(t,h.date);return d>=-7&&d<=2;});
}
function listOngoing(){
  var t=tISO(),rows=[];
  sb.projects.forEach(function(p){
    if(p.done||!p.phases.length)return;
    var s=p.phases[0].start,e=p.open||p.phases[p.phases.length-1].end;
    if(s<=t&&t<=e)rows.push({kind:'타임라인',title:p.title,owner:'',sub:fmtMD(s)+'~'+(p.open?'Open '+fmtMD(p.open):fmtMD(e)),url:null,ref:{type:'project',id:p.id}});
  });
  sb.tasks.forEach(function(tk){
    if(tk.done)return;
    var inSpan=tk.start&&tk.end&&tk.start<=t&&t<=tk.end;
    var going=(tk.status||'').indexOf('진행')>=0;
    if(inSpan||going)rows.push({kind:'단건',title:tk.title,owner:tk.owner,sub:(tk.tag!=='기타'?tk.tag+' · ':'')+fmtMD(tk.start)+'~'+fmtMD(tk.end),url:tk.url,rm:tk.rm,ref:{type:'task',id:tk.id}});
  });
  return rows;
}
function listIssues(){
  var rows=[];
  function pull(item,type){
    (item.issues||[]).forEach(function(is){
      if(!is.done)rows.push({issue:is,host:item,type:type});
    });
  }
  sb.projects.forEach(function(p){pull(p,'project');});
  sb.tasks.forEach(function(t){pull(t,'task');});
  return rows;
}

/* ══════════════ 렌더: 타임라인 ══════════════ */
function phCls(name){
  if(name==='디자인')return 'ph-design';
  if(name==='퍼블')return 'ph-pub';
  if(name==='기획')return 'ph-plan';
  if(name==='개발')return 'ph-dev';
  return 'ph-qa';
}
function segHtml(cls,flex,label,titleAttr){
  return '<div class="seg '+cls+'" style="flex:'+flex+'" title="'+esc(titleAttr||label)+'">'+label+'</div>';
}
function nextHandoffLine(hs){
  var t=tISO(),up=null,late=null;
  hs.forEach(function(h){
    var d=sbDiff(t,h.date);
    if(d<0&&d>=-7&&!late)late=h;
    if(d>=0&&(!up||h.date<up.date))up=h;
  });
  var h=late||up;
  if(!h)return '';
  var d=sbDiff(t,h.date);
  var cls=d<0?'ho-line late':'ho-line';
  var txt=d<0?esc(h.label)+' '+fmtMD(h.date)+' · '+(-d)+'일 지연':esc(h.label)+' '+fmtMD(h.date)+' · D-'+d;
  return '<span class="'+cls+'">⇄ '+txt+'</span>';
}
function issuesHtml(item,type){
  var arr=item.issues||[];
  if(!arr.length)return '';
  return '<div class="issue-list">'+arr.map(function(is){
    return '<label class="issue-row'+(is.done?' done':'')+'"><input type="checkbox" '+(is.done?'checked':'')+' data-act="issue-done" data-type="'+type+'" data-host="'+item.id+'" data-iid="'+is.id+'"><span>'+esc(is.text)+' <em style="color:var(--text3);font-style:normal;font-size:11px">'+fmtMD(is.date)+'</em></span></label>';
  }).join('')+'</div>';
}
function cardActs(type,id,done){
  var reopenBtn=done?'<button class="icbtn" data-act="reopen" data-type="'+type+'" data-id="'+id+'">수정요청 재오픈</button>':'';
  return '<span class="tl-acts">'+reopenBtn+'<button class="icbtn" data-act="issue-add" data-type="'+type+'" data-id="'+id+'">+ 이슈</button><button class="icbtn" data-act="edit" data-type="'+type+'" data-id="'+id+'">수정</button><button class="icbtn" data-act="del" data-type="'+type+'" data-id="'+id+'">삭제</button></span>';
}
function projCard(p){
  var total=0;
  p.phases.forEach(function(ph){total+=Math.max(1,sbDiff(ph.start,ph.end)+1);});
  var segs=p.phases.map(function(ph){
    var dur=Math.max(1,sbDiff(ph.start,ph.end)+1);
    var flex=Math.max(.8,dur/Math.max(total,1)*10);
    var lab=ph.name+' '+fmtMD(ph.start)+(ph.end!==ph.start?'~'+fmtMD(ph.end):'')+(ph.owner?' · '+ownerDisp(ph.owner):'');
    return segHtml(phCls(ph.name),flex.toFixed(2),lab,p.title+' · '+lab);
  }).join('');
  var openChip='';
  if(p.open){
    var d=sbDiff(tISO(),p.open);
    openChip='<span class="dchip open">Open '+fmtMD(p.open)+(d>=0?' · D-'+d:' · 오픈됨')+'</span>';
  }
  var hs=allHandoffs().filter(function(h){return h.ref.type==='project'&&h.ref.id===p.id;});
  return '<div class="tl-card'+(p.done?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(p.done?'checked':'')+' data-act="done" data-type="project" data-id="'+p.id+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(p.title)+'</span>'
    +'<span class="chip biz">'+esc(p.biz)+'</span>'+openChip
    +(p.reopen?'<span class="chip reopen">⟳ 재오픈 이력</span>':'')
    +cardActs('project',p.id,p.done)+'</div>'
    +'<div class="bar">'+segs+'</div>'
    +'<div class="tl-foot">'+(p.done?'':nextHandoffLine(hs))+'</div>'
    +issuesHtml(p,'project')+'</div>';
}
function taskSeg(t,flex){
  var link=t.rm?'<a href="'+esc(t.url)+'" target="_blank" rel="noopener">#'+esc(t.rm)+'</a> ':'';
  var lab=link+esc(t.tag)+' '+fmtMD(t.start)+'~'+fmtMD(t.end)+' · '+ownerDisp(t.owner);
  return '<div class="seg '+phCls(t.tag)+'" style="flex:'+flex+'" title="'+esc(t.title)+'">'+lab+'</div>';
}
function chainCard(arr){
  var head=arr[0],allDone=arr.every(function(t){return t.done;});
  var segs=arr.map(function(t){return taskSeg(t,'1');}).join('');
  var last=arr[arr.length-1];
  if(last.tag==='퍼블')segs+='<div class="seg ph-stub" style="flex:.7">개발 전달 '+fmtMD(last.end)+'</div>';
  var hs=allHandoffs().filter(function(h){return arr.some(function(t){return h.ref.type==='task'&&h.ref.id===t.id;});});
  var reopen=arr.some(function(t){return t.reopen;});
  return '<div class="tl-card'+(allDone?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(allDone?'checked':'')+' data-act="done" data-type="chain" data-id="'+head.chain+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(head.title)+'</span>'
    +'<span class="chip biz">'+esc(head.biz)+'</span>'
    +'<span class="chip solo">연결 '+arr.length+'건</span>'
    +(reopen?'<span class="chip reopen">⟳ 재오픈 이력</span>':'')
    +cardActs('task',last.id,allDone)+'</div>'
    +'<div class="bar">'+segs+'</div>'
    +'<div class="tl-foot">'+(allDone?'':nextHandoffLine(hs))+'</div>'
    +arr.map(function(t){return issuesHtml(t,'task');}).join('')+'</div>';
}
function soloCard(t){
  var segs=taskSeg(t,'2')+'<div class="seg ph-stub" style="flex:1">개발 전달 '+fmtMD(t.end)+'</div>';
  var hs=allHandoffs().filter(function(h){return h.ref.type==='task'&&h.ref.id===t.id;});
  return '<div class="tl-card'+(t.done?' is-done':'')+'">'
    +'<div class="tl-head"><input type="checkbox" '+(t.done?'checked':'')+' data-act="done" data-type="task" data-id="'+t.id+'" title="완료 표시">'
    +'<span class="tl-title">'+esc(t.title)+'</span>'
    +'<span class="chip biz">'+esc(t.biz)+'</span>'
    +'<span class="chip solo">퍼블 단독</span>'
    +(t.reopen?'<span class="chip reopen">⟳ 재오픈 이력</span>':'')
    +cardActs('task',t.id,t.done)+'</div>'
    +'<div class="bar">'+segs+'</div>'
    +'<div class="tl-foot">'+(t.done?'':nextHandoffLine(hs))+'</div>'
    +issuesHtml(t,'task')+'</div>';
}
function renderSbTimeline(){
  var g=chainGroups(),html='';
  var items=[];
  sb.projects.forEach(function(p){
    var s=p.phases.length?p.phases[0].start:'9999';
    items.push({sort:s,html:projCard(p)});
  });
  for(var k in g)items.push({sort:g[k][0].start,html:chainCard(g[k])});
  if(sb.ui.solo){
    sb.tasks.forEach(function(t){
      if(!t.chain&&t.tag==='퍼블')items.push({sort:t.start,html:soloCard(t)});
    });
  }
  items.sort(function(a,b){return a.sort<b.sort?-1:1;});
  html=items.map(function(i){return i.html;}).join('');
  $('#sbTimeline').innerHTML=html||'<div class="empty">아직 등록된 타임라인 업무가 없습니다.<br>메일 본문을 붙여넣으면 디자인→퍼블→개발 일정이 자동으로 만들어져요.</div>';
}

/* ══════════════ 렌더: 달력 ══════════════ */
var calY=sbToday().getFullYear(),calM=sbToday().getMonth();
function collectBars(){
  var bars=[];
  sb.tasks.forEach(function(t){
    if(!t.start||!t.end)return;
    bars.push({s:t.start,e:t.end,owner:t.owner,label:(t.rm?'#'+t.rm+' ':'')+t.title,done:t.done,type:'task',id:t.id});
  });
  sb.projects.forEach(function(p){
    p.phases.forEach(function(ph){
      if(!sbMember(ph.owner))return;
      bars.push({s:ph.start,e:ph.end,owner:ph.owner,label:p.title+' · '+ph.name,done:p.done,type:'project',id:p.id});
    });
  });
  return bars.filter(function(b){var m=sbMember(b.owner);return m&&m.visible;});
}
function renderCal(){
  $('#sbCalTitle').textContent=calY+'년 '+(calM+1)+'월';
  var first=new Date(calY,calM,1),last=new Date(calY,calM+1,0);
  var cur=addD(first,-((first.getDay()+6)%7));
  var bars=collectBars(),t=tISO(),html='';
  html+='<div class="cal-dow">'+['월','화','수','목','금','토','일'].map(function(d,i){return '<span class="'+(i>4?'wkend':'')+'">'+d+'</span>';}).join('')+'</div>';
  var any=false;
  while(cur<=last){
    var wkS=iso(cur),wkE=iso(addD(cur,6));
    var dn='<div class="days">';
    for(var i=0;i<7;i++){
      var d=addD(cur,i),inM=d.getMonth()===calM,isT=iso(d)===t;
      var cls=(inM?'':'out ')+(i>4?'wkend ':'')+(isT?'today':'');
      dn+='<span class="'+cls.trim()+'"'+(isT?' data-d="'+d.getDate()+'"':'')+'>'+(isT?'':d.getDate())+'</span>';
    }
    dn+='</div>';
    var wb=bars.filter(function(b){return b.s<=wkE&&b.e>=wkS;}).sort(function(a,b){return a.s<b.s?-1:1;});
    var lanes=[],bh='';
    wb.forEach(function(b){
      var li=-1;
      for(var j=0;j<lanes.length;j++){if(lanes[j]<b.s){li=j;break;}}
      if(li<0){li=lanes.length;lanes.push(b.e);}else{lanes[li]=b.e;}
      var si=Math.max(0,sbDiff(wkS,b.s)),ei=Math.min(6,sbDiff(wkS,b.e));
      var m=sbMember(b.owner);
      var st='grid-column:'+(si+1)+'/'+(ei+2)+';grid-row:'+(li+1)+';background:linear-gradient(120deg,'+m.c1+','+m.c2+')';
      bh+='<button class="bar-ev'+(b.done?' is-done':'')+'" style="'+st+'" data-act="bar" data-type="'+b.type+'" data-id="'+b.id+'" title="'+esc(b.owner+' · '+b.label+' ('+fmtMD(b.s)+'~'+fmtMD(b.e)+')')+'">'+esc(b.label)+'</button>';
      any=true;
    });
    html+='<div class="week">'+dn+'<div class="lanes">'+bh+'</div></div>';
    cur=addD(cur,7);
  }
  if(!any)html+='<div class="cal-empty">이 달에 표시할 업무가 없습니다. 레드마인 텍스트를 붙여넣어 보세요.</div>';
  $('#sbCal').innerHTML=html;
}

/* ══════════════ 데이터 조작 ══════════════ */
function findTask(id){for(var i=0;i<sb.tasks.length;i++)if(sb.tasks[i].id===id)return sb.tasks[i];return null;}
function findProject(id){for(var i=0;i<sb.projects.length;i++)if(sb.projects[i].id===id)return sb.projects[i];return null;}
function cleanupChains(){
  var g=chainGroups();
  for(var k in g)if(g[k].length<2)g[k].forEach(function(t){t.chain=null;});
}
function toggleDone(type,id){
  if(type==='project'){var p=findProject(id);if(p)p.done=!p.done;}
  else if(type==='chain'){
    var arr=(chainGroups()[id]||[]);
    var allDone=arr.every(function(t){return t.done;});
    arr.forEach(function(t){t.done=!allDone;});
  }
  else{var t=findTask(id);if(t)t.done=!t.done;}
  sbSave();renderSbAll();closeModal();
}
function doReopen(type,id){
  if(type==='project'){var p=findProject(id);if(p){p.done=false;p.reopen=true;}}
  else{
    var t=findTask(id);
    if(t){
      var arr=t.chain?(chainGroups()[t.chain]||[t]):[t];
      arr.forEach(function(x){x.done=false;});
      t.reopen=true;
    }
  }
  sbSave();renderSbAll();toast('수정 요청으로 다시 열었어요');
}
function doDelete(type,id){
  if(type==='project'){
    if(!confirm('이 타임라인을 삭제할까요?'))return;
    sb.projects=sb.projects.filter(function(p){return p.id!==id;});
  }else{
    if(!confirm('이 업무를 삭제할까요?'))return;
    sb.tasks=sb.tasks.filter(function(t){return t.id!==id;});
    cleanupChains();
  }
  sbSave();renderSbAll();toast('삭제했어요');
}

function exportSbJson(){
  var blob=new Blob([JSON.stringify(sb,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='일정보드-백업-'+tISO()+'.json';
  a.click();
  toast('백업 파일을 내려받았어요');
}
function importSbJson(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var s=JSON.parse(rd.result);
      if(!s||!s.members||!s.tasks)throw new Error('bad');
      sb=s;sbSave();renderSbAll();toast('백업을 불러왔어요');
    }catch(e){toast('파일을 읽지 못했어요. 일정보드 백업 파일인지 확인해 주세요.');}
  };
  rd.readAsText(file);
}

  if(!el)return;
  var act=el.dataset.act,type=el.dataset.type,id=el.dataset.id;
  if(act==='open-mail')openMailModal();

  else if(act==='export')exportSbJson();

  else if(act==='modal-close')closeModal();
  else if(act==='sum-toggle'){selCard=(selCard===el.dataset.key?null:el.dataset.key);renderCards();}
  else if(act==='leg-toggle'){var m=sbMember(el.dataset.name);if(m){m.visible=!m.visible;sbSave();renderLegend();renderCal();}}
  else if(act==='cal-prev'){calM--;if(calM<0){calM=11;calY--;}renderCal();}
  else if(act==='cal-next'){calM++;if(calM>11){calM=0;calY++;}renderCal();}
  else if(act==='cal-today'){calY=sbToday().getFullYear();calM=sbToday().getMonth();renderCal();}
  else if(act==='bar')detailModal(type,id);
  else if(act==='done')toggleDone(type,id);
  else if(act==='reopen')doReopen(type,id);
  else if(act==='del')doDelete(type,id);
  else if(act==='issue-add'){closeModal();openIssueModal(type,id);}
  else if(act==='issue-done'){
    var host=(type==='project'?findProject(el.dataset.host):findTask(el.dataset.host));
    if(host){
      (host.issues||[]).forEach(function(is){if(is.id===el.dataset.iid)is.done=el.checked;});
      sbSave();renderSbAll();
    }
  }
  else if(act==='save-issue'){
    var txt=$('#issueTxt').value.trim();
    if(!txt){toast('이슈 내용을 입력해 주세요');return;}
    var h=(type==='project'?findProject(id):findTask(id));
    if(h){h.issues=h.issues||[];h.issues.push({id:uid('i'),text:txt,date:tISO(),done:false});sbSave();renderSbAll();}
    closeModal();toast('이슈를 기록했어요');
  }
  else if(act==='edit'){
    closeModal();
    if(type==='project'){var p=findProject(id);if(p)mailPreview({title:p.title,biz:p.biz,open:p.open,phases:p.phases},p.id);}
    else{var t=findTask(id);if(t)rmPreview(t,t.id);}
  }
  else if(act==='ph-add'){$('#phRows').insertAdjacentHTML('beforeend',phaseRowHtml(null));}
  else if(act==='ph-del'){el.closest('.phrow').remove();}
  else if(act==='parse-mail'){
    var txt=$('#mailTxt').value;
    if(!txt.trim()){toast('메일 본문을 붙여넣어 주세요');return;}
    var d=parseMail(txt);
    if(!d.phases.length&&!d.open){toast('일정 형식을 찾지 못했어요. 직접 입력으로 이어갈게요');}
    mailPreview(d,null);
  }
  else if(act==='save-mail'){
    var pid=el.dataset.pid;
    var phases=readPhaseRows();
    var title=$('#mTitle').value.trim();
    if(!title){toast('업무명을 입력해 주세요');return;}
    if(!phases.length){toast('단계 일정을 최소 1개 입력해 주세요');return;}
    if(pid){
      var p=findProject(pid);
      if(p){p.title=title;p.biz=$('#mBiz').value;p.open=$('#mOpen').value;p.phases=phases;}
      toast('타임라인을 수정했어요');
    }else{
      sb.projects.push({id:uid('p'),title:title,biz:$('#mBiz').value,open:$('#mOpen').value,phases:phases,done:false,reopen:false,issues:[]});
      toast('타임라인에 등록했어요');
    }
    sbSave();renderSbAll();closeModal();
  }
  else if(act==='parse-rm'){
    var txt2=$('#rmTxt').value;
    if(!txt2.trim()){toast('레드마인 텍스트를 붙여넣어 주세요');return;}
    rmPreview(parseRedmine(txt2),null);
  }
  else if(act==='save-rm'){
    var tid=el.dataset.tid;
    var title2=$('#rmTitle').value.trim();
    var start=$('#rmStart').value,end=$('#rmEnd').value||start;
    if(!title2){toast('업무명을 입력해 주세요');return;}
    if(!start){toast('시작일을 입력해 주세요');return;}
    var rm=$('#rmNum').value.trim();
    var sel=$('#rmChain').value,chain=null;
    if(sel){var tgt=findTask(sel);if(tgt){chain=tgt.chain||uid('c');tgt.chain=chain;}}
    var data={rm:rm,url:rm?RM_BASE+rm:'',title:title2,tag:$('#rmTag').value,owner:$('#rmOwner').value.trim(),start:start,end:end,biz:$('#rmBiz').value,status:$('#rmStatus').value.trim(),prio:$('#rmPrio').value.trim(),chain:chain};
    if(tid){
      var t2=findTask(tid);
      if(t2){for(var k in data)t2[k]=data[k];}
      toast('업무를 수정했어요');
    }else{
      data.id=uid('t');data.done=false;data.reopen=false;data.issues=[];
      sb.tasks.push(data);
      toast(chain?'등록하고 타임라인으로 연결했어요':'달력에 등록했어요');
    }
    cleanupChains();sbSave();renderSbAll();closeModal();
  }
});

var KW_LABEL={figma:'피그마 신기능',adobe:'어도비 신기능',ai:'🤖 AI 뉴스',industry:'업계동향',design:'디자인',trend:'트렌드',frontend:'프론트엔드'};
var KW_COLOR={figma:'#3a7d44',adobe:'#b84c1a',ai:'#c2185b',industry:'#7b3fa0',design:'#1a5fa0',trend:'#a06020',frontend:'#1a7a7a'};
var kwCards=[], kwCurFilter='all';
var LS_KW='wd_kw_articles'; // 누적 기사 저장 키

// 로컬스토리지에서 누적 기사 불러오기
function kwLsLoad(){
  try{
    var s=localStorage.getItem(LS_KW);
    if(s) kwCards=JSON.parse(s);
  }catch(e){}
}

// 새 기사를 기존 누적 데이터에 병합 (title 기준 중복 제거, 최신 유지)
function kwMerge(newArticles){
  var map={};
  // 기존 데이터 먼저 맵에 등록
  kwCards.forEach(function(a){ map[a.title]=a; });
  // 새 데이터로 덮어쓰기 (최신 내용 우선)
  newArticles.forEach(function(a){ map[a.title]=a; });
  // collectedAt 기준 최신순 정렬
  kwCards=Object.values(map).sort(function(a,b){
    var da=a.publishedAt||a.collectedAt||a.date||'';
    var db=b.publishedAt||b.collectedAt||b.date||'';
    return db.localeCompare(da);
  });
  try{ localStorage.setItem(LS_KW, JSON.stringify(kwCards)); }catch(e){}
}

// 누적 기사 초기화
function kwClearStorage(){
  if(!confirm('저장된 모든 지식지갑 기사를 초기화할까요?\n삭제 후 새로고침 시 최신 데이터만 표시돼요.')) return;
  localStorage.removeItem(LS_KW);
  kwCards=[];
  kwLoad();
  toast('지식지갑 기사를 초기화했어요');
}

async function kwLoad(){
  // 기존 누적 데이터 먼저 표시 (빠른 렌더링)
  kwLsLoad();
  if(kwCards.length>0){
    kwRender();
    document.getElementById('kwupd').textContent='불러오는 중...';
  } else {
    document.getElementById('kwgrid').innerHTML='<div class="kwloading"><div class="dots"><span></span><span></span><span></span></div><p style="margin-top:14px">뉴스를 불러오는 중이에요</p></div>';
  }

  // 새 데이터 fetch 후 누적 병합 (실시간 피드 우선, 실패 시 저장소 스냅샷을 오프라인 폴백으로 사용)
  var sources=[
    'https://soullim.github.io/knowledge-wallet/news.json?t='+Date.now(),
    'news.json?t='+Date.now()
  ];
  var fetched=false;
  for(var i=0;i<sources.length;i++){
    try{
      var res=await fetch(sources[i]);
      if(!res.ok) continue;
      var data=await res.json();
      var articles=data.articles||[];
      if(articles.length>0){
        kwMerge(articles); // 누적 병합
        var now=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
        document.getElementById('kwupd').textContent='마지막 업데이트: '+now+' · 총 '+kwCards.length+'개';
        fetched=true; break;
      }
    }catch(e){ continue; }
  }

  if(!fetched){
    // fetch 실패 시 누적 데이터 그대로 유지, 없으면 샘플
    if(kwCards.length===0){
      kwCards=kwSample();
      document.getElementById('kwupd').textContent='샘플 데이터 (연결 실패)';
    } else {
      document.getElementById('kwupd').textContent='오프라인 · 누적 '+kwCards.length+'개';
    }
  }
  kwRender();
}

function kwRender(){
  var filtered=kwCurFilter==='all'?kwCards:kwCards.filter(function(c){ return c.category===kwCurFilter; });
  var list=[].concat(filtered).sort(function(a,b){
    var da=a.publishedAt||a.collectedAt||'', db=b.publishedAt||b.collectedAt||'';
    return db.localeCompare(da);
  });
  document.getElementById('kwcnt').textContent=list.length+'개';
  if(!list.length){ document.getElementById('kwgrid').innerHTML='<div class="kwloading" style="color:var(--text3)">해당 분야의 뉴스가 없어요</div>'; return; }
  document.getElementById('kwgrid').innerHTML=list.map(function(card,i){
    var idx=kwCards.indexOf(card);
    return '<article class="kwcard kwcard-'+card.category+'" style="animation-delay:'+(i*.04)+'s" onclick="kwOpen('+idx+')">'+
      '<div class="kwbar"></div>'+
      '<div class="kwbody">'+
        '<div class="kwtop2">'+
          '<span class="kwchip chip-'+card.category+'">'+(KW_LABEL[card.category]||card.category)+'</span>'+
          '<span class="kwdate">'+(card.date||'')+'</span>'+
        '</div>'+
        '<p class="kwtitle">'+esc(card.title)+'</p>'+
        '<p class="kwsummary">'+esc(card.summary)+'</p>'+
        '<div class="kwkws">'+(card.keywords||[]).map(function(k){ return '<span class="kwtag"># '+esc(k)+'</span>'; }).join('')+'</div>'+
        '<div class="kwfoot"><span class="kwsrc">'+esc(card.source)+'</span><span class="kwmore">자세히 보기 →</span></div>'+
      '</div>'+
    '</article>';
  }).join('');
}

function kwSetFilter(cat,btn){
  kwCurFilter=cat;
  document.querySelectorAll('.kwfbtn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  kwRender();
}

function kwOpen(idx){
  var c=kwCards[idx]; if(!c) return;
  var col=KW_COLOR[c.category]||'#888';
  document.getElementById('kwacc').style.background=col;
  document.getElementById('kwmsrcdot').style.background=col;
  document.getElementById('kwmchip').textContent=KW_LABEL[c.category]||c.category;
  document.getElementById('kwmchip').className='kwchip chip-'+c.category;
  document.getElementById('kwmdate').textContent=c.date||'';
  document.getElementById('kwmtitle').textContent=c.title||'';
  document.getElementById('kwmsrc').textContent=c.source||'';
  document.getElementById('kwmlink').href=c.url||'#';
  document.getElementById('kwmsum').textContent=c.summary||'';
  var full=c.summary_full||c.summary||'';
  var sents=full.split(/(?<=[.!?])\s+/).filter(function(s){ return s.trim().length>5; });
  document.getElementById('kwmpts').innerHTML=sents.map(function(s){
    return '<li><span class="kwmpt-dot" style="background:'+col+';opacity:.5"></span><span>'+esc(s.trim())+'</span></li>';
  }).join('')||('<li><span class="kwmpt-dot" style="background:'+col+';opacity:.5"></span><span>'+esc(full)+'</span></li>');
  document.getElementById('kwmkws').innerHTML=(c.keywords||[]).map(function(k){ return '<span class="kwmkw"># '+esc(k)+'</span>'; }).join('');
  window._kwUrl=c.url||location.href;
  document.getElementById('kwmovl').classList.add('on');
  document.body.style.overflow='hidden';
}
function kwMClose(e){ if(e.target===document.getElementById('kwmovl')) kwMDismiss(); }
function kwMDismiss(){ document.getElementById('kwmovl').classList.remove('on'); document.body.style.overflow=''; }
function kwCopy(){
  navigator.clipboard.writeText(window._kwUrl||location.href).then(function(){
    var btn=document.querySelector('.kwmshare');
    var orig=btn.textContent; btn.textContent='✅ 복사됐어요!';
    setTimeout(function(){ btn.textContent=orig; },2000);
  });
}
